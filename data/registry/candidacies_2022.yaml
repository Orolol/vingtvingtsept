# Registre historique daté des candidatures — présidentielle 2022 (docs/12, lot 1).
# Validé et interrogé par `vvs.registry.candidacies` (`load_candidacies(2022)`, `state_at`).
#
# Structure : voir l'en-tête de candidacies_2017.yaml (commune à tous les candidacies_<année>.yaml).
# Style compact : une ligne de flux par référence, personne, tour et événement ; les références
# sont factorisées dans `references` (alias `wp_<langue>_<revid>` pour une révision Wikipédia,
# `<média>_<aaaammjj>_<mot>` pour la presse).
#
# Vérification des sources (2026-10-23) : les articles de presse cités pour les candidats
# officiels et pour la plupart des personnes actives aux quatre dates du backtest ont été rouverts
# sur web.archive.org (titre et date de publication relus) ; les autres portent la note « non
# rouverte » et leur date vient de la référence Wikipédia ou de l'URL.
#
# Lecture : `state_at(date)` n'utilise que les événements publiés strictement avant la date.
# Une date de première trace est celle des sources parcourues, pas la première trace réelle ;
# les écarts connus sont signalés dans les notes, sans correction du registre.

election: 2022

collection:
  collected_on: 2026-10-23
  protocol: >-
    Liste des personnes : tout nom qui apparaît, dans les sources ci-dessous et pendant la
    période, comme candidat déclaré (à l'élection ou à une primaire), candidat à la
    candidature, personnalité pressentie, ayant exprimé son intérêt, évoquée par les
    commentateurs, ou ayant décliné. Instantanés Wikipédia : révision en vigueur à 00:00 UTC
    le 1er et le 15 de chaque mois, aux quatre dates du backtest 2022 et le jour de la liste
    officielle (back/studies/candidacies_wikipedia.py, manifeste et empreintes dans
    runs/2026-10-23-candidacies/wikipedia/), complétés par les noms en gras sans lien des
    tableaux de la page des candidatures, que l'extraction automatique ne relève pas. Dossier
    de presse : un article de presse nationale « qui sont les candidats » publié dans les 30
    jours avant chacune des quatre dates du backtest (60 jours si aucun). Les dates des
    déclarations, retraits et désignations viennent des articles de presse cités par ces
    révisions ; à défaut, de la révision elle-même (borne par excès).
  sources:
    - id: wp_fr_election
      kind: wikipedia_revisions
      title: Élection présidentielle française de 2022
      url: https://fr.wikipedia.org/wiki/%C3%89lection_pr%C3%A9sidentielle_fran%C3%A7aise_de_2022
      period: [2021-01-01, 2022-04-10]
      cadence: 1er et 15 du mois, 2021-10-12, 2022-01-10, 2022-03-11, 2022-04-03, 2022-03-07
      note: >-
        Sections dont le titre contient « candidat » ou « primaire ». Ne liste pas les
        personnalités non déclarées ; les listes passent sur la page des candidatures à l'été 2021.
    - id: wp_fr_candidacies
      kind: wikipedia_revisions
      title: Candidatures à l'élection présidentielle française de 2022
      url: https://fr.wikipedia.org/wiki/Candidatures_%C3%A0_l%27%C3%A9lection_pr%C3%A9sidentielle_fran%C3%A7aise_de_2022
      period: [2021-01-01, 2022-04-10]
      cadence: idem
      note: Contenu propre à partir de juillet 2021 (première révision retenue 2021-07-28).
    - id: wp_en_election
      kind: wikipedia_revisions
      title: 2022 French presidential election
      url: https://en.wikipedia.org/wiki/2022_French_presidential_election
      period: [2021-01-01, 2022-04-10]
      cadence: idem
      note: >-
        Sections « candidates » et « primary » ; liste les candidats potentiels (« Potential »)
        jusqu'en septembre 2021.
    - id: press_dossiers
      kind: press
      title: Dossier de presse aux dates du backtest
      period: [2021-09-12, 2022-04-03]
      note: >-
        Le Figaro (2021-10-04, capture du 2021-10-09) pour 2021-10-12 ; pour 2022-01-10, aucun
        panorama dans la fenêtre : repli hors règle sur LCI « qui sont les candidats déclarés ? »
        (publié 2021-10-13, mis à jour 2021-12-06, capture du 2021-12-29), sans statut nouveau
        par rapport aux révisions ; franceinfo (2022-03-07, liste officielle) pour 2022-03-11 et
        2022-04-03.
    - id: wp_primaries
      kind: wikipedia_page
      title: Sections des primaires des révisions parcourues (PCF, écologie, PS, LR, Primaire populaire)
      note: Participants, tours et résultats ; dates relues sur la presse citée (Public Sénat, Le Temps, Le Monde, France 24).
    - id: cc_list
      kind: official
      title: Décision n° 2022-187 PDR du 7 mars 2022
      url: https://www.conseil-constitutionnel.fr/decision/2022/2022187PDR.htm
  exclusions: >-
    Écartés de la liste : personnes citées seulement comme soutiens, porte-parole, directeurs de
    campagne (Bertrand Soubelet), organisateurs (Olivier Faure, Corinne Lepage), dirigeants
    commentant, parrains ou bénéficiaires de parrainages sans candidature (« personnes non
    candidates ayant reçu des parrainages » : Borloo, Delga, Glucksmann, Meurice, Pesquet,
    Herrou, Ménard, Saint-Paul, Blanchet, Lacroix, Cojan, Philippe Célestin Maréchal, Josef
    Schovanec), personnalités nommées dans la biographie d'un autre (Bayrou, Rivasi, Baupin),
    personnalités citées comme parrainées à la Primaire populaire sans être candidates
    (Clémentine Autain). Une personne déjà retenue pour une autre raison (Barnier, Cazeneuve,
    Hollande, Philippe, Ruffin) n'a pas d'événement pour ses seuls parrainages.

