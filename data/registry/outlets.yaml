# Panel de titres de presse nationale (docs/06-presse.md, « Panel de titres »).
#
# Lu par vvs.ingest.press.outlets.load_outlets. Sert à filtrer les sorties de GDELT
# (`artlist`, champ `domain`) et de Media Cloud (`media_url`, ou `source_ids` résolus dans
# la collection « France - National » 34412146) : on compte les titres d'un panel fixe sur
# toute la période, pour ne pas confondre une hausse de volume avec un élargissement de la
# couverture de la source.
#
# Champs :
#   name      nom d'usage
#   kind      daily (quotidien national), weekly (hebdomadaire ou mensuel d'actualité),
#             online (pure player), tv_news (chaîne ou rédaction télé), radio, agency,
#             regional_daily (hors panel national, gardé pour contrôle)
#   domains   domaines enregistrables, sans « www. » ; la correspondance se fait par suffixe
#             (« www.lemonde.fr » et « abonnes.lemonde.fr » -> lemonde.fr). Le premier est le
#             domaine principal. Les anciens domaines restent listés (huffingtonpost.fr).
#   panel     true si le titre entre dans le panel stable ; false = suivi mais exclu des
#             agrégats (couverture irrégulière, régional, international)
#   since     première année où le titre existe sous ce domaine, si postérieure à 2008
#   mediacloud_in_collection : présence vérifiée dans l'instantané Zenodo du 8 janvier 2026
#             de la collection 34412146 (docs/notes/veille-2026-10-20.md §3.1) ;
#             null = non vérifié
#   url_patterns (agence seulement) : préfixes d'URL (domaine + chemin) par lesquels des
#             dépêches sont republiées par un autre titre (« AFP via relais »)
#
# Domaines relevés de mémoire et recoupés avec la liste de la veille ; à contrôler sur un
# échantillon GDELT et Media Cloud avant la classification de masse.

outlets:
  # --- quotidiens nationaux
  le_monde:
    name: Le Monde
    kind: daily
    domains: [lemonde.fr]
    panel: true
    mediacloud_in_collection: true
