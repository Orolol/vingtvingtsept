  rmc:
    name: RMC
    kind: radio
    domains: [rmc.bfmtv.com]
    panel: false
    mediacloud_in_collection: null
    notes: >-
      Sous-domaine de bfmtv.com. La correspondance la plus spécifique l'emporte : les pages
      rmc.bfmtv.com (beaucoup de sport) vont à rmc, hors panel, et ne gonflent pas bfmtv.
  # --- agence
  afp:
    name: Agence France-Presse
    kind: agency
    domains: [afp.com]
    panel: true
    mediacloud_in_collection: true
    url_patterns:
      - lefigaro.fr/flash-actu/
    notes: >-
      afp.com publie peu de dépêches en clair ; l'essentiel du fil passe par les titres
      clients. Le seul relais identifiable par l'URL relevé ici est la rubrique « flash-actu »
      du Figaro (à vérifier sur échantillon). Une dépêche relayée est attribuée à afp, pas
      au titre qui la republie.
  # --- hors panel : international francophone et régional (contrôle)
  france24:
