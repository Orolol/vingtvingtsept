# Reports de voix publiés AVANT le premier tour, dans les sondages de duel hypothétique de
# l'élection en cours (étude docs/results/2026-11-24-reports-publies.md).
#
# Fichier séparé de transfers.yaml (reports réalisés, lus par le modèle par défaut), qu'il ne
# modifie pas. Il n'est lu que si l'option est activée : SecondRoundModel(current_transfers=…),
# chargé par vvs.registry.transfers_current.load_current_transfers. Relevé le 2026-11-24.
#
# Doctrine de transfers.yaml : chiffres recopiés tels quels de la source primaire (PDF de
# l'institut ou notice de la Commission des sondages), en % ; aucune cellule complétée de mémoire
# ni déduite par différence à 100 ; « - » de la source = 0 (noté). Chaque tableau a été relu par
# l'agent principal dans le texte du PDF (pdftotext -layout) à la page indiquée ; les PDF
# historiques sont conservés sous runs/2026-11-24-reports-publies/sources/ (hors Git).
#
# - `pair` : les deux finalistes de l'hypothèse ; `to` de chaque ligne : ces deux candidats et
#   `none` (colonne « abstention / blanc / nul / ne se prononce pas » de la source, telle quelle).
# - `rows[].from` : candidate_id de l'électorat (intention de vote au premier tour). Seules les
#   lignes des candidats NON finalistes sont recopiées : le modèle ignore la fidélité des
#   électorats des finalistes, les lignes « Ensemble » et « abstention, vote blanc ».
# - `hypotheses` : une entrée par hypothèse de premier tour quand le tableau en distingue
#   plusieurs (sinon une seule, `label` décrivant la configuration).
# - `published` : date de publication lue (document ou page de l'institut) ; absente, la
#   disponibilité vaut fieldwork_end + 2 jours.
# - `base` : likely_voters (certains d'aller voter ou probabilité 8-10 sur 10), registered
#   (inscrits), ou other (voir base_note).

