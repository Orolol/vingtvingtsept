# Reports de voix publiés pour les législatives 2022 et 2024 et pour des duels présidentiels
# hypothétiques RN contre Mélenchon (étude docs/results/2026-11-24-duel-rn-lfi.md).
#
# Fichier séparé de transfers.yaml, qu'il ne modifie pas, et que le modèle ne lit pas : il sert
# au seul diagnostic de vvs.eval.duel_rn_lfi (`load_surveys`). Relevé le 2026-11-24.
#
# Même doctrine que transfers.yaml : chiffres recopiés tels quels, en % ; AUCUNE cellule n'est
# complétée de mémoire ni déduite par différence à 100 ; une cellule non lue mot à mot dans la
# source est absente. Champ `verified` : qui a lu le tableau dans la source.
#
# Différences de format avec transfers.yaml (les électorats ne sont pas des candidats du registre) :
# - `election` : leg2022, leg2024 ou pres_hypothetical ; `duel` : type de duel (rn_vs_nfp,
#   rn_vs_nfp_lfi, rn_vs_nfp_non_lfi, rn_vs_ensemble, rn_vs_lr_dvd, rn_vs_nupes,
#   nupes_vs_ensemble, le_pen_vs_melenchon, bardella_vs_melenchon, rn_vs_nfp_by_label) ;
# - `timing` : between_rounds (intention avant le second tour), second_round_day (déclaration le
#   jour du vote), second_round_night_estimate (enquête + bureaux de vote, publiée le soir),
#   hypothetical_presidential ;
# - `rows[].from` : électorat de premier tour libellé par camp (nfp, nupes, ensemble, lr, lr_dvd,
#   lr_udi_dvd, rn, rn_uxd, reconquete, dvg_hors_nupes, abstain…, ou vote présidentiel
#   `<candidat>_2022` / intention `<candidat>_2027`, ou all_registered / proximite_<parti>) ;
#   `rows[].to` : camps du second tour (rn, nfp, nfp_lfi, nupes, ensemble, lr, le_pen,
#   melenchon, bardella) puis selon la source blank_or_abstain, non_expressed, abstain ;
# - `base` : first_round_electorate (lignes sommant à 100 avec l'abstention),
#   second_round_expressed (exprimés seulement), other (souhait de victoire en choix forcé,
#   échantillon entier, etc. : voir base_note).
#
# Cherché sans succès (2026-11-24) : matrice Ipsos du second tour 2024 (jour du vote ou soir),
# Ifop-Fiducial, Harris/Toluna, Cluster17, Odoxa et OpinionWay 2024 (pas de tableau de reports
# publié), hypothèses Le Pen contre Mélenchon de 2017 et 2022 avec détail des reports.
# Écarté : Fondation Jean-Jaurès du 30 août 2024 (Ipsos, Enquête électorale française vague 7 :
# « 73 % des électeurs Ensemble ont choisi un candidat NFP » dans les duels NFP-RN), base non
# précisée et incompatible avec « un gros tiers » d'abstention cité dans le même texte.

transfers:
- id: elabe_leg2024_entre2tours_rn_vs_nfp
  election: leg2024
  duel: rn_vs_nfp
  timing: between_rounds
  pollster: elabe
  sponsor: BFMTV et La Tribune Dimanche
  title: Les Français et les élections législatives — Reports de voix T1 / T2 – Configuration duel NFP-DVG
    vs. RN
  url: https://elabe.fr/wp-content/uploads/2024/07/05072024_elabe_bfmtv_la-tribune-dimanche_les-francais-et-les-elections-legislatives.pdf
  published: '2024-07-05'
  pages: diapositive 13 (synthèse chiffrée aussi en diapositive 6)
  fieldwork_start: '2024-07-03'
  fieldwork_end: '2024-07-04'
  sample_size: 2005
  mode: online
  base: first_round_electorate
  base_note: '« En % » ; lignes = électorat du 1er tour, colonnes = intention au 2nd tour, avec une colonne
    « Abstention, vote blanc ou nul ». La fiche technique précise : « Pour les questions d''intention
    de vote, seules les personnes inscrites sur les listes électorales et ayant l''intention d''aller
    voter sont prises en compte » (s''applique a priori aux intentions, pas à cette matrice qui contient
    l''abstention). La source ne dit pas si la question est posée à tous ou seulement dans les circonscriptions
    concernées.'
  columns_in_source:
