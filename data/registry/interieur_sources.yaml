        sha256: c0872749a0e68ff2a0b6d37cbd26a0c9e603576b88e1c75bace6af9677c5bc7a
        notes: >-
          Le T1 France entière n'existe qu'en .xlsx (le jeu ne publie pas de .csv à ce niveau).
          Une ligne FE : 16 colonnes fixes puis blocs de 4 (nuance, voix, % ins, % exp).
      - name: resultats-definitifs-france-entiere-t2.xlsx
        url: https://static.data.gouv.fr/resources/elections-legislatives-des-30-juin-et-7-juillet-2024-resultats-definitifs-du-2nd-tour/20240710-170421/resultats-definitifs-france-entiere.xlsx
        dataset: https://www.data.gouv.fr/fr/datasets/668b4092826ddcf70e9e62cd/
        format: leg_fe_xlsx
        role: national
        rounds: [2]
        sha256: 3cad38d1120539ddc3fd8eebcd44df9619f946ff5d66d266afaa65d7b26cf743
        notes: Même format que le T1 (le .csv existe aussi, non utilisé).
