processes:
  - id: primaire_droite_centre_2016
    name: "Primaire de la droite et du centre (20 et 27 novembre 2016)"
    kind: open_primary
    organizers: [lr, pcd]
    participants: [fillon_francois, juppe_alain, sarkozy_nicolas, le_maire_bruno, kosciusko_morizet_nathalie, cope_jean_francois, poisson_jean_frederic]
    winner: fillon_francois
    events_yaml: lr_primary_2016
    sources: [lejdd_20160909_primaire]
    notes: "Onze candidatures déposées le 9 septembre 2016 ; la Haute autorité retient sept candidats (liste publiée le 21 septembre, Mariton disqualifié). Le CNIP est associé à la primaire mais absent de parties.yaml. Engagement documenté de François Bayrou de soutenir Alain Juppé s'il gagnait (sans effet : Juppé est battu)."
    commitments:
      - {person: bayrou_francois, winners: [juppe_alain], published: 2015-07-15, sources: [huffingtonpost_20150715_bayrou], note: "Bayrou envisage une candidature « sauf si Alain Juppé remporte la primaire », auquel cas il le soutiendra (formulation reprise par Wikipédia du 2015-12-31 au 2017-03)."}
    rounds:
      - {date: 2016-11-20, published: 2016-11-20, qualified: [fillon_francois, juppe_alain], sources: [lemonde_20161120_primaire], note: "Fillon et Juppé qualifiés, Sarkozy, Le Maire, Kosciusko-Morizet, Copé et Poisson éliminés ; résultats connus le soir du vote."}
      - {date: 2016-11-27, published: 2016-11-27, qualified: [fillon_francois], sources: [lelab_20161127_fillon], note: "Fillon 66,49 %."}
  - id: primaire_ecologiste_2016
    name: "Primaire de l'écologie (19 octobre et 7 novembre 2016)"
    kind: open_primary
    organizers: [eelv]
    participants: [jadot_yannick, rivasi_michele, duflot_cecile, delli_karima]
    winner: jadot_yannick
    sources: [lemonde_20160827_eelv]
    notes: "Candidatures closes le 31 août 2016 (36 parrainages de conseillers fédéraux) ; quatre candidats qualifiés. Vote par internet, résultats proclamés le jour de la clôture de chaque tour."
    rounds:
      - {date: 2016-10-19, published: 2016-10-19, qualified: [jadot_yannick, rivasi_michele], sources: [lemonde_20161019_primaire], note: "Duflot et Delli éliminées."}
      - {date: 2016-11-07, published: 2016-11-07, qualified: [jadot_yannick], sources: [huffingtonpost_20161107_primaire]}
  - id: consultation_pcf_2016
    name: "Consultation des communistes (24-26 novembre 2016)"
    kind: members_vote
    organizers: [pcf]
    participants: [melenchon_jean_luc, chassaigne_andre]
    winner: melenchon_jean_luc
    sources: [lefigaro_20161107_pcf]
    notes: "Vote des adhérents entre deux options : soutien à Jean-Luc Mélenchon ou candidature communiste autonome (préférée par la conférence nationale du 5 novembre). Aucun candidat n'était désigné pour la seconde option ; André Chassaigne, qui s'en dit « disponible » et fait campagne contre le ralliement, est retenu comme son porteur (doute signalé). Pierre Laurent, qui prône le soutien à Mélenchon, ne concourt pas : engagement documenté."
    commitments:
      - {person: laurent_pierre, winners: [melenchon_jean_luc], published: 2016-11-04, sources: [bfmtv_20161104_laurent], note: "Pierre Laurent se dit prêt à soutenir Mélenchon et propose ce soutien au vote des militants."}
    rounds:
      - {date: 2016-11-26, published: 2016-11-26, qualified: [melenchon_jean_luc], sources: [rtl_20161126_pcf], note: "53,6 % pour le soutien à Mélenchon."}
  - id: primaire_belle_alliance_2017
    name: "Primaire citoyenne de la Belle Alliance populaire (22 et 29 janvier 2017)"
    kind: citizen_primary
    organizers: [ps, prg]
    participants: [hamon_benoit, valls_manuel, montebourg_arnaud, peillon_vincent, de_rugy_francois, pinel_sylvia, bennahmias_jean_luc]
    winner: hamon_benoit
    events_yaml: ps_primary_2017
    sources: [lemonde_20161217_primaire]
    notes: "Liste des sept candidats validée par la haute autorité le 17 décembre 2016 (24 dépôts). Organisateurs : PS et partis de la Belle Alliance populaire (PRG, Parti écologiste, UDE, Front démocrate), seuls les deux premiers figurant dans parties.yaml."
    rounds:
      - {date: 2017-01-22, published: 2017-01-22, qualified: [hamon_benoit, valls_manuel], sources: [politis_20170122_primaire], note: "Hamon 36,03 %, Valls 31,48 % (page anglaise) ; résultats connus le soir du vote."}
      - {date: 2017-01-29, published: 2017-01-29, qualified: [hamon_benoit], sources: [lemonde_20170129_primaire], note: "Hamon 58,69 %."}

