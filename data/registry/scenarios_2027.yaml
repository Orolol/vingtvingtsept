# Scénarios de candidats pour la présidentielle 2027 (voir docs/04-modele.md § 3).
#
# Les probabilités sont des JUGEMENTS datés, pas des estimations : chaque changement passe par
# une entrée de `revisions` (date, auteur, résumé, justification). Validé et énuméré par
# `vvs.registry.scenarios` (`load_scenarios()`, `enumerate_configurations()`).
#
# Structure :
# - `dimensions` : incertitudes qui changent la paire qualifiée ou les reports. Chaque état
#   liste les candidate_id présents (data/registry/candidates.yaml) ; `placeholders` désigne un
#   candidat non identifié, connu seulement par son bloc. Les probabilités d'une dimension
#   somment à 1. Les dimensions sont indépendantes, sauf `constraints`.
#   `label` (dimension et état) : libellé court affiché par le site, combiné en « RN : Bardella »
#   pour un état et en « Le Pen · Philippe seul · … » pour une configuration (vvs export).
# - `small_candidates` : présence de Bernoulli indépendante (au premier tour officiel, donc
#   500 parrainages obtenus et candidature maintenue) ; `bloc` = bloc du registre en 2027.
# - `constraints` : quand tous les états de `when` sont actifs, les candidats de `absent` sont
#   absents (petit candidat : présence ramenée à 0 ; candidat d'une dimension : configuration
#   impossible), ou la combinaison entière est impossible (`impossible: true`). Les
#   configurations impossibles sont retirées et le reste est renormalisé.
#
# Sources : docs/notes/veille-2026-10-20.md § 1, plus les pages citées dans chaque entrée
# (consultées le 2026-10-20). `sources` d'une entrée : URL, ou alias défini dans `references`.

election: 2027
as_of: 2026-10-20

references:
  WP_2027: https://fr.wikipedia.org/wiki/%C3%89lection_pr%C3%A9sidentielle_fran%C3%A7aise_de_2027
  WP_CAND: https://fr.wikipedia.org/wiki/Candidatures_%C3%A0_l%27%C3%A9lection_pr%C3%A9sidentielle_fran%C3%A7aise_de_2027
  FI_LISTE: https://www.franceinfo.fr/elections/presidentielle/portraits-qui-sont-les-candidats-declares-a-l-election-presidentielle-de-2027_8208032.html
  VEILLE: docs/notes/veille-2026-10-20.md

dimensions:
  - id: rn
    label: RN
    question: Qui porte la candidature du RN ?
    review: [2026-12-16 (audience QPC en cassation), 2027-03-12 (clôture des parrainages), arrêt de cassation]
    states:
      - id: le_pen
        label: Le Pen
        probability: 0.88
        candidates: [le_pen_marine]
        description: >-
          Marine Le Pen candidate. L'arrêt d'appel du 7 juillet 2026 ramène la partie ferme de
          l'inéligibilité à 15 mois, déjà purgés ; le pourvoi est suspensif et un rejet la
          laisse éligible. Le risque résiduel est surtout politique ou lié à une cassation avec
          « renaissance » contestée de l'exécution provisoire.
        sources:
          - https://lcp.fr/actualites/marine-le-pen-condamnee-dans-l-affaire-des-assistants-parlementaires-reste-eligible-pour
          - https://kohenavocats.com/marine-le-pen-pourvoi-cassation-memoires-15-octobre-arret-avant-avril-2027/
          - https://actu.orange.fr/politique/affaire-des-assistants-parlementaires-du-rn-la-cour-de-cassation-fixera-le-sort-de-marine-le-pen-le-16-decembre-l-express-via-6medias-CNT000002t1bDR.html
      - id: bardella
        label: Bardella
        probability: 0.12
        candidates: [bardella_jordan]
        description: >-
          Jordan Bardella remplace Marine Le Pen (inéligibilité, choix stratégique avant le
          12 mars, santé). Le Pen dit « pas de plan B » et destine Bardella à Matignon.
        sources:
          - https://www.franceinfo.fr/politique/front-national/affaire-des-assistants-fn-au-parlement-europeen/il-va-accepter-sans-probleme-la-decision-de-marine-le-pen-comment-jordan-bardella-et-la-candidate-du-rn-vont-ils-faire-campagne-en-binome-en-2027_8098388.html

  - id: centre
    label: Bloc central
    question: Quelle offre pour le bloc central ?
    review: ["chaque mois jusqu'au 2027-03-12"]
    states:
      - id: philippe_only
        label: Philippe seul
        probability: 0.50
        candidates: [philippe_edouard]
        description: >-
          Philippe seul candidat du bloc central : Attal se retire. Philippe seul gagne 6 à 8
          points sur le cas à deux (Ifop, septembre 2026) ; Attal seul fait 13 % contre 18 %
          pour Philippe seul (Ifop, 12-14 octobre 2026). Darmanin et Wauquiez soutiennent
          Philippe.
        sources:
          - https://www.journaldunet.com/business/action-publique/1532943-edouard-philippe-officialise-sa-candidature-a-la-presidentielle-2027-et-se-dit-pret-en-cas-de-scrutin-anticipe/
          - https://touteleurope.eu/vie-politique-des-etats-membres/presidentielle-2027-marine-le-pen-largement-en-tete-dans-les-sondages-a-six-mois-du-premier-tour-trois-candidats-au-coude-a-coude-pour-la-deuxieme-place
          - https://www.rtl.fr/actu/politique/edouard-philippe-peut-incarner-l-ordre-et-le-serieux-laurent-wauquiez-soutient-le-candidat-horizons-et-invite-bruno-retailleau-a-se-retirer-7900651585
      - id: philippe_attal
        label: Philippe et Attal
        probability: 0.35
        candidates: [philippe_edouard, attal_gabriel]
        description: >-
          Philippe et Attal tous deux candidats au premier tour. Attal, déclaré le 22 mai
          2026, n'exclut pas une primaire que Philippe refuse ; aucun accord de retrait n'est
          sourcé au 20 octobre.
        sources:
          - https://lcp.fr/actualites/presidentielle-2027-gabriel-attal-officialise-sa-candidature-436721
      - id: attal_only
        label: Attal seul
        probability: 0.10
        candidates: [attal_gabriel]
        description: >-
          Attal seul : Philippe se retire (santé, affaire, effondrement sondagier). Peu
          probable, Philippe étant en tête du bloc dans tous les sondages.
        sources: []
      - id: other
        label: Autre candidat
        probability: 0.05
        candidates: []
        placeholders: [centre]
        description: >-
          Ni Philippe ni Attal : candidat de substitution du bloc central non identifié
          (pressentis : Le Maire, Bergé, Barrot, Breton selon WP_CAND).
        sources: [WP_CAND]

  - id: left
    label: Gauche hors LFI
    question: La gauche hors LFI est-elle consolidée derrière Glucksmann ?
    review: [2027-03-12 (clôture des parrainages)]
    states:
      - id: consolidated
        label: Glucksmann seul
        probability: 0.35
        candidates: [glucksmann_raphael]
        description: >-
          Glucksmann seul candidat de la gauche hors LFI, avec au plus un petit candidat
          (Batho) : Tondelier, Ruffin, Cazeneuve, Hollande et Bouamrane se rallient ou
          n'obtiennent pas leurs parrainages (voir la contrainte left_consolidated). Roussel
          (PCF, bloc far_left) est traité à part comme petit candidat.
        sources:
          - https://lcp.fr/actualites/primaire-socialiste-vainqueur-des-le-1er-tour-raphael-glucksmann-sera-le-candidat-de-la
          - https://www.publicsenat.fr/actualites/politique/primaire-de-la-gauche-raphael-glucksmann-plie-le-match-et-remporte-le-scrutin-des-le-premier-tour-avec-66
      - id: fragmented
        label: Glucksmann et Tondelier
        probability: 0.65
        candidates: [glucksmann_raphael, tondelier_marine]
        description: >-
          Glucksmann et Tondelier présents ; Ruffin, Cazeneuve, Hollande, Bouamrane, Batho
          et Roussel selon leurs probabilités de petits candidats. La primaire unitaire a
          échoué, Tondelier est désignée par Les Écologistes le 21 septembre 2026, Ruffin a dit
          « s'il n'y a pas de primaire, moi j'y vais ».
        sources:
          - https://en.wikipedia.org/wiki/2026_United_Left_primary
          - https://lcp.fr/actualites/presidentielle-2027-s-il-n-y-a-pas-de-primaire-moi-j-y-vais-annonce-francois-ruffin
          - WP_CAND

  - id: lr
    label: LR
    question: LR présente-t-il Bruno Retailleau ?
    review: [2027-03-12 (clôture des parrainages)]
    states:
      - id: retailleau
        label: Retailleau
        probability: 0.80
        candidates: [retailleau_bruno]
        description: >-
          Retailleau, désigné par LR le 19 avril 2026, va au premier tour. Barnier, Baroin,
          Pécresse et Ménard le soutiennent (WP_CAND).
        sources: [WP_CAND]
      - id: rally
        label: Ralliement au centre
        probability: 0.20
        candidates: []
        description: >-
          LR se rallie à un candidat du bloc central (Philippe) avant le 12 mars. Wauquiez,
          président du groupe LR à l'Assemblée, soutient Philippe depuis le 1er juillet 2026 et
          estime que Retailleau, « en dessous de 10 % », doit savoir se retirer.
        sources:
          - https://www.bfmtv.com/politique/elections/presidentielle/le-candidat-lr-est-en-dessous-de-10-laurent-wauquiez-juge-que-bruno-retailleau-doit-savoir-se-retirer-si-c-est-necessaire-et-tend-la-main-a-edouard-philippe-pour-la-presidentielle_AN-202607010735.html

  - id: lfi
    label: LFI
    question: Qui porte la candidature de LFI ?
    review: []
    states:
      - id: melenchon
        label: Mélenchon
        probability: 0.97
        candidates: [melenchon_jean_luc]
        description: >-
          Mélenchon, déclaré le 3 mai 2026 (TF1), électorat le plus sûr de son choix (Elabe) ;
          le NPA-L'Anticapitaliste le soutient (29 juin 2026).
        sources:
          - WP_CAND
          - https://www.franceinfo.fr/elections/presidentielle/le-npa-anticapitaliste-renonce-a-presenter-un-candidat-a-l-election-presidentielle-2027-et-annonce-soutenir-jean-luc-melenchon_8084936.html
      - id: substitute
        label: Remplaçant
        probability: 0.03
        candidates: [bompard_manuel]
        description: >-
          Mélenchon empêché ; LFI présente un autre candidat, représenté par Manuel Bompard
          (coordinateur du mouvement), faute de nom annoncé.
        sources: []

  - id: reconquete
    label: Reconquête
    question: Reconquête présente-t-il un candidat, et lequel ?
    review: [2027-03-12 (clôture des parrainages)]
    states:
      - id: zemmour
        label: Zemmour
        probability: 0.88
        candidates: [zemmour_eric]
        description: >-
          Zemmour, candidature confirmée le 17 septembre 2026 sur BFMTV ; candidat en 2022
          avec ses parrainages.
        sources:
          - https://www.bfmtv.com/politique/elections/presidentielle/je-serai-candidat-eric-zemmour-annonce-sur-bfmtv-qu-il-se-presentera-a-l-election-presidentielle_AV-202609170947.html
      - id: knafo
        label: Knafo
        probability: 0.02
        candidates: [knafo_sarah]
        description: >-
          Knafo remplace Zemmour. Elle a déclaré le 29 avril 2026 ne pas être candidate et
          soutient Zemmour : branche résiduelle.
        sources:
          - https://www.franceinfo.fr/politique/pas-candidate-a-l-election-presidentielle-de-2027-sarah-knafo-lance-une-grande-consultation-des-francais_7970540.html
      - id: none
        label: Pas de candidat
        probability: 0.10
        candidates: []
        description: >-
          Pas de candidat Reconquête au premier tour (parrainages manqués ou retrait au profit
          du RN).
        sources: []

small_candidates:
  # --- far_right
  - candidate_id: dupont_aignan_nicolas
    probability: 0.75
    bloc: far_right
    rationale: >-
      Candidature officialisée le 19 septembre 2026 (JDD), quatrième campagne ; présent en
      2012, 2017 et 2022 (elections.yaml).
    sources: [WP_CAND, FI_LISTE]
  - candidate_id: philippot_florian
    probability: 0.20
    bloc: far_right
    rationale: >-
      Déclaré le 9 mai 2026, mais se dit prêt à se retirer devant une candidature
      souverainiste « plus rassembleuse » ; parrainages incertains pour un petit parti.
    sources:
      - https://www.franceinfo.fr/elections/presidentielle/presidentielle-2027-le-souverainiste-florian-philippot-annonce-sa-candidature-a-l-elysee_7993346.html
  - candidate_id: de_villiers_philippe
    probability: 0.08
    bloc: far_right
    rationale: >-
      Seulement pressenti (WP_CAND), aucune déclaration ; Philippot se retirerait à son
      profit.
    sources: [WP_CAND]
  # --- right
  - candidate_id: bertrand_xavier
    probability: 0.25
    bloc: right
    rationale: >-
      A confirmé le 27 août 2026 qu'il serait candidat, mais reste à LR, refuse la primaire
      et n'est presque pas testé par les instituts ; un maintien face à Retailleau est peu
      probable.
    sources:
      - https://www.liberation.fr/politique/le-president-lr-des-hauts-de-france-xavier-bertrand-confirme-quil-sera-candidat-en-2027-20260827_PF5ERRL6GNEP7PWMY7GQ4SJDL4/
  - candidate_id: lisnard_david
    probability: 0.40
    bloc: right
    rationale: >-
      Déclaré le 31 mars 2026 en quittant LR, maire de Cannes avec un réseau d'élus locaux ;
      réclame toujours une primaire, ce qui laisse ouvert un retrait.
    sources:
      - https://www.bfmtv.com/politique/presidentielle-2027-david-lisnard-appelle-a-une-primaire-de-la-droite-et-se-porte-candidat_AN-202501170372.html
  - candidate_id: platret_gilles
    probability: 0.10
    bloc: right
    rationale: Déclaré le 8 octobre 2026, divers droite sans parti national, parrainages difficiles.
    sources: [WP_CAND, FI_LISTE]
  # --- centre
  - candidate_id: becht_olivier
    probability: 0.10
    bloc: centre
    rationale: >-
      Déclaré le 24 septembre 2026 (Paris Match), concurrent direct de Philippe et Attal
      dans le même espace ; maintien jusqu'au premier tour improbable.
    sources: [WP_CAND, FI_LISTE]
  # --- left (hors dimension `left`)
  - candidate_id: ruffin_francois
    probability: 0.60
    bloc: far_left
    rationale: >-
      Candidat depuis le 1er avril 2025, « s'il n'y a pas de primaire, moi j'y vais » ; la
      primaire unitaire a été abandonnée. Absent si la gauche hors LFI se consolide.
    sources:
      - https://lcp.fr/actualites/presidentielle-2027-s-il-n-y-a-pas-de-primaire-moi-j-y-vais-annonce-francois-ruffin
  - candidate_id: cazeneuve_bernard
    probability: 0.40
    bloc: left
    rationale: >-
      Déclaré le 16 juillet 2026 hors primaire (Le Monde), sans grand parti pour les
      parrainages ; absent si la gauche hors LFI se consolide.
    sources:
      - https://www.lemonde.fr/politique/article/2026/07/16/presidentielle-2027-bernard-cazeneuve-se-declare-candidat-dans-un-entretien-au-parisien-et-decline-la-primaire-socialiste_6723827_823448.html
  - candidate_id: hollande_francois
    probability: 0.10
    bloc: left
    rationale: >-
      Pressenti, non déclaré ; la victoire de Glucksmann à la primaire « n'entame pas ses
      ambitions » (Le Figaro, 12 octobre 2026). Absent si la gauche hors LFI se consolide.
    sources:
      - https://www.lefigaro.fr/elections/presidentielles/presidentielle-2027-la-candidature-de-raphael-glucksmann-n-entame-pas-les-ambitions-de-francois-hollande-20261012
  - candidate_id: bouamrane_karim
    probability: 0.10
    bloc: left
    rationale: >-
      Déclaré le 9 juin 2026 hors primaire, alors que le PS soutient désormais Glucksmann ;
      absent si la gauche hors LFI se consolide.
    sources: [WP_CAND, FI_LISTE]
  - candidate_id: batho_delphine
    probability: 0.15
    bloc: left
    rationale: >-
      Déclarée le 25 novembre 2025 (Génération écologie), opposée à la primaire ; petit parti,
      parrainages incertains.
    sources: [WP_CAND, FI_LISTE]
  # --- far_left
  - candidate_id: roussel_fabien
    probability: 0.80
    bloc: far_left
    rationale: >-
      Désigné par le PCF le 6 septembre 2026 pour une candidature « en solitaire » ; le PCF a
      ses propres élus pour les parrainages, Roussel était candidat en 2022.
    sources:
      - https://www.lefigaro.fr/elections/presidentielles/candidats/presidentielle-2027-adoube-par-ses-militants-le-communiste-fabien-roussel-officialise-sa-candidature-en-solitaire-20260906
  - candidate_id: arthaud_nathalie
    probability: 0.90
    bloc: far_left
    rationale: >-
      Candidate LO déclarée le 8 décembre 2025 ; présente en 2012, 2017 et 2022
      (elections.yaml).
    sources: [WP_CAND]
  - candidate_id: kazib_anasse
    probability: 0.20
    bloc: far_left
    rationale: Déclaré le 1er juin 2026 (Révolution permanente), petite organisation, parrainages incertains.
    sources: [WP_CAND, FI_LISTE]
  - candidate_id: labib_selma
    probability: 0.15
    bloc: far_left
    rationale: Déclarée le 17 juin 2026 (NPA-Révolutionnaires), petite organisation, parrainages incertains.
    sources: [WP_CAND, FI_LISTE]
  - candidate_id: poutou_philippe
    probability: 0.02
    bloc: far_left
    rationale: >-
      Le NPA-L'Anticapitaliste a renoncé le 29 juin 2026 à présenter un candidat et soutient
      Mélenchon ; Poutou figure parmi les pressentis ayant décliné (WP_CAND).
    sources:
      - https://www.franceinfo.fr/elections/presidentielle/le-npa-anticapitaliste-renonce-a-presenter-un-candidat-a-l-election-presidentielle-2027-et-annonce-soutenir-jean-luc-melenchon_8084936.html
  # --- other
  - candidate_id: lassalle_jean
    probability: 0.45
    bloc: other
    rationale: >-
      Candidat 2017 et 2022 ; a lancé en juillet 2026 une cagnotte de 100 000 € pour pouvoir
      se représenter, ce qui conditionne sa candidature au financement.
    sources:
      - https://www.franceinfo.fr/elections/presidentielle/presidentielle-2027-jean-lassalle-lance-une-cagnotte-pour-pouvoir-etre-de-nouveau-candidat-a-l-election_8102522.html
  - candidate_id: asselineau_francois
    probability: 0.35
    bloc: other
    rationale: >-
      Déclaré depuis 2023, candidat en 2017 ; renvoyé en correctionnelle pour agression et
      harcèlement sexuels (mai 2026), ce qui pèse sur la collecte des parrainages.
    sources:
      - https://www.20minutes.fr/justice/4224280-20260519-candidat-presidentielle-2027-francois-asselineau-bientot-juge-agressions-harcelement-sexuels
  - candidate_id: de_villepin_dominique
    probability: 0.35
    bloc: other
    rationale: >-
      Pressenti, non déclaré, testé à 2-3 % par Elabe ; il estime que les parrainages ne
      buteront pas sur le même mur qu'en 2012 (HuffPost, 29 mars 2026).
    sources:
      - https://www.huffingtonpost.fr/politique/article/pourquoi-villepin-ne-croit-pas-que-sa-candidature-a-la-presidentielle-2027-se-heurtera-au-meme-mur-qu-en-2012_262038.html
  - candidate_id: polony_natacha
    probability: 0.20
    bloc: other
    rationale: Déclarée le 14 octobre 2026 sans étiquette ni parti, candidature jugée très fragile par RMC.
    sources:
      - https://www.lefigaro.fr/elections/presidentielles/presidentielle-2027-je-suis-candidate-annonce-la-journaliste-natacha-polony-20261014
      - https://rmc.bfmtv.com/actualites/politique/natacha-polony-officiellement-candidate-a-la-presidentielle-c-est-courageux-mais-elle-part-au-casse-pipe_AN-202610140447.html

constraints:
  - id: left_consolidated
    when: {left: consolidated}
    absent: [ruffin_francois, cazeneuve_bernard, hollande_francois, bouamrane_karim]
    rationale: >-
      La consolidation signifie précisément que les autres candidatures de la gauche
      hors LFI se retirent ; seul un petit candidat (Batho) peut subsister.
  - id: lr_rally_not_to_attal
    when: {lr: rally, centre: attal_only}
    impossible: true
    rationale: >-
      Le ralliement envisagé à droite (Wauquiez) vise Philippe ; un ralliement de LR à Attal
      seul n'a aucun soutien déclaré : la combinaison est exclue et sa masse (0,02) est
      redistribuée par renormalisation.
  - id: lr_rally_retailleau_absent
    when: {lr: rally}
    absent: [retailleau_bruno]
    rationale: >-
      Exemple de contrôle explicite : en cas de ralliement, Retailleau n'est présent dans
      aucune configuration (redondant avec la liste vide de l'état, garde-fou si une autre
      dimension venait à le citer).

revisions:
  - date: 2026-10-20
    author: claude (agent registre), à valider par Gaétan
    summary: >-
      Création à partir des propositions de docs/notes/veille-2026-10-20.md § 1.5, mises à
      jour par une recherche du 20 octobre (WP_CAND révisée le 20 octobre à 01 h 25 UTC,
      FI_LISTE du 19 octobre). Changements par rapport à la veille : LR retailleau/rally
      0,85/0,15 → 0,80/0,20 ; Mélenchon et Reconquête passent en dimensions (substitution
      LFI 0,03 ; Zemmour 0,88 / Knafo 0,02 / aucun 0,10) ; bloc central « autre » porté par
      un placeholder de bloc ; gauche hors LFI à deux états (Glucksmann seul, ou Glucksmann
      + Tondelier), Ruffin, Cazeneuve, Hollande et Bouamrane devenant de petits candidats
      exclus par la consolidation ; Poutou à 0,02 ; Bertrand, Lisnard, Philippot, Platret,
      Becht, Batho, Bouamrane, Kazib, Labib, Polony ajoutés (et à candidates.yaml).
    rationale: >-
      Faits absents de la veille et trouvés le 20 octobre : Wauquiez soutient Philippe et
      appelle Retailleau à se retirer (BFMTV, RTL, 1er juillet 2026) ; le NPA-A soutient
      Mélenchon et Poutou ne se présente pas (franceinfo, 29 juin 2026) ; Knafo n'est pas
      candidate (franceinfo, 29 avril 2026) ; Bertrand confirme sa candidature (Libération,
      27 août 2026) ; Lassalle conditionne la sienne à une cagnotte (juillet 2026) ;
      Polony se déclare le 14 octobre. Aucun retrait ni accord Philippe-Attal ou
      Glucksmann-Tondelier n'est sourcé au 20 octobre : D1, D2 et D3 gardent les valeurs de
      la veille.
