constraints:
  - id: left_consolidated
    when: {left: consolidated}
    absent: [ruffin_francois, cazeneuve_bernard, hollande_francois, bouamrane_karim]
    rationale: >-
      La consolidation signifie précisément que les autres candidatures de la gauche
      hors LFI se retirent ; seul un petit candidat (Batho) peut subsister.
  # lr_rally_not_to_attal et lr_rally_retailleau_absent (2026-10-20) ont disparu avec les
  # dimensions `centre` et `lr` : les états de `right_centre` énumèrent directement les
  # combinaisons admises.

revisions:
  - date: 2026-10-20
    author: claude (agent registre), à valider par Gaétan
    summary: >-
      Création à partir des propositions de docs/notes/veille-2026-10-20.md § 1.5, mises à
      jour par une recherche du 20 octobre (WP_CAND révisée le 20 octobre à 01 h 25 UTC,
      FI_LISTE du 19 octobre). Changements par rapport à la veille : LR retailleau/rally
      0,85/0,15 → 0,80/0,20 ; Mélenchon et Reconquête passent en dimensions (substitution
      LFI 0,03 ; Zemmour 0,88 / Knafo 0,02 / aucun 0,10) ; bloc central « autre » porté par
      un placeholder de bloc ; gauche hors LFI à deux états (Glucksmann seul, ou Glucksmann
      + Tondelier), Ruffin, Cazeneuve, Hollande et Bouamrane devenant de petits candidats
      exclus par la consolidation ; Poutou à 0,02 ; Bertrand, Lisnard, Philippot, Platret,
      Becht, Batho, Bouamrane, Kazib, Labib, Polony ajoutés (et à candidates.yaml).
    rationale: >-
      Faits absents de la veille et trouvés le 20 octobre : Wauquiez soutient Philippe et
      appelle Retailleau à se retirer (BFMTV, RTL, 1er juillet 2026) ; le NPA-A soutient
      Mélenchon et Poutou ne se présente pas (franceinfo, 29 juin 2026) ; Knafo n'est pas
      candidate (franceinfo, 29 avril 2026) ; Bertrand confirme sa candidature (Libération,
      27 août 2026) ; Lassalle conditionne la sienne à une cagnotte (juillet 2026) ;
      Polony se déclare le 14 octobre. Aucun retrait ni accord Philippe-Attal ou
      Glucksmann-Tondelier n'est sourcé au 20 octobre : D1, D2 et D3 gardent les valeurs de
      la veille.
  - date: 2026-11-24
    author: claude (agent registre), à valider par Gaétan
    summary: >-
      Veille web du 24 novembre (WP_CAND révisée le 24 novembre à 09 h 37, pages citées
      consultées le même jour). (1) Les dimensions `centre` et `lr` et le petit candidat Lisnard
      sont fusionnés en une dimension `right_centre` à onze états (ensembles de candidats) ;
      présences marginales : Philippe 0,85 → 0,80, Attal 0,45 → 0,42, Retailleau 0,80 → 0,56,
      Lisnard 0,40 → 0,80, Lagarde 0 → 0,05, autre central 0,05 → 0,02. (2) `left` passe à
      trois états : Glucksmann seul 0,35 → 0,25, Glucksmann sans Tondelier 0,30 (nouveau),
      Glucksmann et Tondelier 0,65 → 0,45. (3) Petits candidats : Ruffin 0,60 → 0,02, Roussel
      0,80 → 0,75, de Villepin 0,35 → 0,60, Riner ajouté à 0,45 (bloc other). (4) Contraintes
      lr_rally_not_to_attal et lr_rally_retailleau_absent supprimées avec leurs dimensions.
      Inchangés : RN, LFI, Reconquête et les autres petits candidats.
    rationale: >-
      Primaire : les équipes d'Attal, Retailleau et Lisnard s'accordent le 17 novembre sur le
      principe d'une primaire ouverte à deux tours fin janvier (F24_PRIMAIRE), Attal (19
      novembre) et Lisnard (22 novembre) promettent de se retirer si l'autre la gagne
      (ATTAL_F2, LISNARD_BFM), mais Philippe refuse d'y participer (LCP_PHILIPPE), Nouvelle
      Énergie dément l'accord et l'inclusion de Zemmour voulue par Lisnard « flingue la
      primaire » selon Retailleau (PS_PRIMAIRE_ZEMMOUR) : primaire tenue jugée à 0,35, gagnée
      par Lisnard 0,40, Attal 0,35, Retailleau 0,25 d'après le sondage Ifop pour Le Figaro des
      13-18 novembre (IFOP_PRIMAIRE ; 29 % Lisnard, 28 % Philippe avec Philippe ; 38 % Attal,
      33 % Lisnard, 29 % Retailleau sans). Philippe : 17 % → 10 % chez Harris et « au mois de
      février, chacun prendra ses responsabilités » (F24_PHILIPPE, HARRIS_NOV) d'où 0,80.
      Lisnard : 10-11 %, devant Retailleau (4-6 %), « poursuivrait sa campagne » sans primaire,
      d'où sa sortie des petits candidats. Lagarde : quitte la BCE le 7 février 2027 pour la
      « liberté de m'engager », testée à 14 % par Cluster17, mais non candidate (FI_LAGARDE,
      CLUSTER17_NOV) : état de recours à 0,05. Gauche : Tondelier se dit « prête » le 18
      novembre à une coalition autour de Mélenchon, vote des adhérents écologistes du 10 au
      13 décembre (REPORTERRE_TONDELIER, POLITIS_ECOLOS) ; Hollande se donne jusqu'à février
      (WP_CAND). Ruffin se retire le 21 novembre ; de Villepin se déclare le 20 novembre avec
      plus de 300 signatures revendiquées ; Riner se déclare le 9 novembre sans parti ni
      parrainage annoncé (FI_RINER) ; neuf députés du groupe communiste soutiennent Mélenchon
      (5 novembre). Riner et Lagarde ne sont donc pas de simples hypothèses de sondeur : Riner
      est candidat déclaré, Lagarde a un fait daté (départ anticipé de la BCE) qui rend sa
      candidature possible. Non retenus faute de fait nouveau vérifiable : Le Pen (audience QPC
      du 16 décembre maintenue), Zemmour (confirmé le 10 novembre, veut entrer dans la
      primaire), Cazeneuve (un soutien à Glucksmann n'est rapporté que par une source
      secondaire), Polony (revendique la moitié des parrainages, non vérifié), Lassalle (pas
      d'annonce sur sa cagnotte), Bertrand (déclaration repoussée à la fin de l'année).
