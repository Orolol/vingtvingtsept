dimensions:
  - id: rn
    label: RN
    question: Qui porte la candidature du RN ?
    review: [2026-12-16 (audience QPC en cassation), 2027-03-12 (clôture des parrainages), arrêt de cassation]
    states:
      - id: le_pen
        label: Le Pen
        probability: 0.88
        candidates: [le_pen_marine]
        description: >-
          Marine Le Pen candidate. L'arrêt d'appel du 7 juillet 2026 ramène la partie ferme de
          l'inéligibilité à 15 mois, déjà purgés ; le pourvoi est suspensif et un rejet la
          laisse éligible. Le risque résiduel est surtout politique ou lié à une cassation avec
          « renaissance » contestée de l'exécution provisoire.
        sources:
          - https://lcp.fr/actualites/marine-le-pen-condamnee-dans-l-affaire-des-assistants-parlementaires-reste-eligible-pour
          - https://kohenavocats.com/marine-le-pen-pourvoi-cassation-memoires-15-octobre-arret-avant-avril-2027/
          - https://actu.orange.fr/politique/affaire-des-assistants-parlementaires-du-rn-la-cour-de-cassation-fixera-le-sort-de-marine-le-pen-le-16-decembre-l-express-via-6medias-CNT000002t1bDR.html
      - id: bardella
        label: Bardella
        probability: 0.12
        candidates: [bardella_jordan]
        description: >-
          Jordan Bardella remplace Marine Le Pen (inéligibilité, choix stratégique avant le
          12 mars, santé). Le Pen dit « pas de plan B » et destine Bardella à Matignon.
        sources:
          - https://www.franceinfo.fr/politique/front-national/affaire-des-assistants-fn-au-parlement-europeen/il-va-accepter-sans-probleme-la-decision-de-marine-le-pen-comment-jordan-bardella-et-la-candidate-du-rn-vont-ils-faire-campagne-en-binome-en-2027_8098388.html

  # Remplace depuis le 2026-11-24 les dimensions `centre` (Philippe / Attal) et `lr`
  # (Retailleau / ralliement) et le petit candidat Lisnard : la primaire envisagée par Attal,
  # Retailleau et Lisnard rend leurs présences dépendantes, d'où une dimension unique dont
  # chaque état est un ensemble de candidats. Probabilités dérivées (révision du 2026-11-24) :
  # primaire tenue 0,35, gagnée par Lisnard 0,40, Attal 0,35, Retailleau 0,25 ; Philippe présent
  # 0,80 ; sans primaire, Attal se maintient 0,45, Retailleau 0,70, Lisnard reste.
  - id: right_centre
    label: Droite et centre
    question: >-
      Quels candidats de la droite et du centre (Philippe, Attal, Retailleau, Lisnard, un
      recours) vont au premier tour ?
    review:
      - 2026-11-26 (réunion des équipes Attal, Retailleau, Lisnard sur la primaire)
      - méthode de départage proposée par Larcher (date non fixée)
      - fin janvier 2027 (primaire éventuelle)
      - 2027-02-07 (départ de Lagarde de la BCE) et février (« chacun prendra ses responsabilités », Philippe)
      - 2027-03-12 (clôture des parrainages)
    states:
      - id: all_four
        label: Philippe, Attal, Retailleau, Lisnard
        probability: 0.16
        candidates: [philippe_edouard, attal_gabriel, retailleau_bruno, lisnard_david]
        description: >-
          Pas de primaire et personne ne se retire : la situation du 24 novembre. Philippe
          refuse la primaire et la juge « de la division » ; Lisnard « poursuivrait sa campagne »
          sans départage ; l'inclusion de Zemmour qu'il réclame « flingue la primaire » selon
          Retailleau.
        sources: [F24_PHILIPPE, LCP_PHILIPPE, LISNARD_BFM, PS_PRIMAIRE_ZEMMOUR]
      - id: no_attal
        label: Philippe, Retailleau, Lisnard
        probability: 0.20
        candidates: [philippe_edouard, retailleau_bruno, lisnard_david]
        description: >-
          Pas de primaire ; Attal se retire derrière Philippe, qui renvoie le choix à février
          (« chacun prendra ses responsabilités ») ; Attal reconnaît « je n'ai pas convaincu les
          Français ». Retailleau et Lisnard se maintiennent.
        sources: [F24_PHILIPPE, ATTAL_F2]
      - id: no_retailleau
        label: Philippe, Attal, Lisnard
        probability: 0.07
        candidates: [philippe_edouard, attal_gabriel, lisnard_david]
        description: >-
          Pas de primaire ; Retailleau (4 à 6 %, derrière Lisnard dans tous les sondages de
          novembre) se retire ou LR se rallie, Attal se maintient.
        sources: [HARRIS_NOV, CLUSTER17_NOV]
      - id: philippe_lisnard
        label: Philippe, Lisnard
        probability: 0.20
        candidates: [philippe_edouard, lisnard_david]
        description: >-
          Lisnard gagne une primaire tenue sans Philippe (Attal s'est engagé à se retirer dans ce
          cas), ou, sans primaire, Attal et Retailleau se retirent. Lisnard est en tête d'une
          primaire avec Philippe (29 % contre 28 %, Ifop pour Le Figaro, 13-18 novembre) et à
          11 % au premier tour devant Philippe à 10 % (Harris, 18-19 novembre).
        sources: [ATTAL_F2, F24_LISNARD, IFOP_PRIMAIRE, HARRIS_NOV]
      - id: philippe_attal
        label: Philippe, Attal
        probability: 0.10
        candidates: [philippe_edouard, attal_gabriel]
        description: >-
          Attal gagne la primaire tenue sans Philippe (en tête sans Philippe : 38 % contre 33 %
          à Lisnard, Ifop pour Le Figaro) ; Lisnard a dit sur BFMTV le 22 novembre qu'il
          quitterait alors la course. Les équipes se sont accordées le 17 novembre sur le principe
          d'une primaire ouverte à deux tours fin janvier, à 2 euros, accord démenti en partie
          par Nouvelle Énergie.
        sources: [F24_PRIMAIRE, GAZ_PRIMAIRE, LISNARD_BFM, WP_PRIMAIRE_DC]
      - id: philippe_retailleau
        label: Philippe, Retailleau
        probability: 0.07
        candidates: [philippe_edouard, retailleau_bruno]
        description: >-
          Retailleau, qui a proposé la primaire par courrier le 10 novembre (31 janvier et
          7 février), la gagne ; il y est dernier dans le sondage Ifop (29 % sans Philippe). Porte
          aussi la masse résiduelle de « Retailleau seul ».
        sources: [WP_PRIMAIRE_DC, LCP_PHILIPPE, GAZ_PRIMAIRE]
      - id: no_philippe
        label: Attal, Retailleau, Lisnard
        probability: 0.06
        candidates: [attal_gabriel, retailleau_bruno, lisnard_david]
        description: >-
          Pas de primaire ; Philippe se retire en février (il dit qu'il « en tirera les
          conséquences » si les Français veulent « passer à autre chose ») et Attal porte le bloc
          central. Philippe est passé de 17 % à 10 % chez Harris entre début octobre et
          mi-novembre.
        sources: [F24_PHILIPPE, HARRIS_NOV]
      - id: lisnard_only
        label: Lisnard seul
        probability: 0.04
        candidates: [lisnard_david]
        description: >-
          Lisnard gagne la primaire et Philippe se retire ou s'y rallie : candidature unique de la
          droite et du centre derrière lui.
        sources: [IFOP_PRIMAIRE, F24_LISNARD]
      - id: attal_only
        label: Attal seul
        probability: 0.03
        candidates: [attal_gabriel]
        description: >-
          Attal gagne la primaire et Philippe se retire ou s'y rallie.
        sources: [F24_PRIMAIRE]
      - id: lagarde
        label: Lagarde, Retailleau, Lisnard
        probability: 0.05
        candidates: [lagarde_christine, retailleau_bruno, lisnard_david]
        description: >-
          Christine Lagarde, qui quitte la BCE le 7 février 2027 pour avoir « la liberté de
          m'engager », devient le recours du bloc central à la place de Philippe et d'Attal. Elle
          n'est pas candidate et avait écarté l'idée en septembre ; testée par Cluster17 (9-10
          novembre) à 14 % comme seule candidate centrale, 8 % dans l'hypothèse à 18 candidats.
          Dix semaines entre son départ et le premier tour, cinq avant la clôture des
          parrainages.
        sources: [FI_LAGARDE, CLUSTER17_NOV]
      - id: other
        label: Autre central, Retailleau, Lisnard
        probability: 0.02
        candidates: [retailleau_bruno, lisnard_david]
        placeholders: [centre]
        description: >-
          Ni Philippe, ni Attal, ni Lagarde : candidat de substitution du bloc central non
          identifié (pressentis : Le Maire, Bergé, Barrot, Breton selon WP_CAND).
        sources: [WP_CAND]

  - id: left
    label: Gauche hors LFI
    question: Quelle offre pour la gauche hors LFI autour de Glucksmann ?
    review:
      - 2026-11-26 (conseil fédéral des Écologistes)
      - 2026-12-13 (vote des adhérents écologistes)
      - février 2027 (décision de Hollande)
      - 2027-03-12 (clôture des parrainages)
    states:
      - id: consolidated
        label: Glucksmann seul
        probability: 0.25
        candidates: [glucksmann_raphael]
        description: >-
          Glucksmann seul candidat de la gauche hors LFI, avec au plus un petit candidat
          (Batho) : Tondelier se retire (vers Glucksmann ou vers une coalition autour de
          Mélenchon) et Cazeneuve, Hollande et Bouamrane se rallient ou n'obtiennent pas leurs
          parrainages (voir la contrainte left_consolidated). Roussel (PCF, bloc far_left) est
          traité à part comme petit candidat.
        sources:
          - https://lcp.fr/actualites/primaire-socialiste-vainqueur-des-le-1er-tour-raphael-glucksmann-sera-le-candidat-de-la
          - REPORTERRE_TONDELIER
      - id: without_tondelier
        label: Glucksmann sans Tondelier
        probability: 0.30
        candidates: [glucksmann_raphael]
        description: >-
          Tondelier se retire, le plus probablement pour une coalition autour de Mélenchon
          qu'elle s'est dite « prête » à construire le 18 novembre (France 2), mais Cazeneuve,
          Hollande et Bouamrane restent libres selon leurs probabilités de petits candidats.
          Hollande se donne jusqu'à février pour décider (WP_CAND).
        sources: [REPORTERRE_TONDELIER, POLITIS_ECOLOS, WP_CAND]
      - id: fragmented
        label: Glucksmann et Tondelier
        probability: 0.45
        candidates: [glucksmann_raphael, tondelier_marine]
        description: >-
          Tondelier se maintient (« je resterai candidate » tant que les adhérents n'en ont pas
          décidé autrement) : le vote des adhérents du 10 au 13 décembre choisit la candidature
          autonome, défendue par David Cormand, plutôt que le soutien à Mélenchon ou à
          Glucksmann. Cazeneuve, Hollande, Bouamrane, Batho et Roussel selon leurs probabilités
          de petits candidats.
        sources:
          - REPORTERRE_TONDELIER
          - POLITIS_ECOLOS
          - https://en.wikipedia.org/wiki/2026_United_Left_primary

  - id: lfi
    label: LFI
    question: Qui porte la candidature de LFI ?
    review: []
    states:
      - id: melenchon
        label: Mélenchon
        probability: 0.97
        candidates: [melenchon_jean_luc]
        description: >-
          Mélenchon, déclaré le 3 mai 2026 (TF1), électorat le plus sûr de son choix (Elabe) ;
          le NPA-L'Anticapitaliste le soutient (29 juin 2026).
        sources:
          - WP_CAND
          - https://www.franceinfo.fr/elections/presidentielle/le-npa-anticapitaliste-renonce-a-presenter-un-candidat-a-l-election-presidentielle-2027-et-annonce-soutenir-jean-luc-melenchon_8084936.html
      - id: substitute
        label: Remplaçant
        probability: 0.03
        candidates: [bompard_manuel]
        description: >-
          Mélenchon empêché ; LFI présente un autre candidat, représenté par Manuel Bompard
          (coordinateur du mouvement), faute de nom annoncé.
        sources: []

  - id: reconquete
    label: Reconquête
    question: Reconquête présente-t-il un candidat, et lequel ?
    review: [2027-03-12 (clôture des parrainages)]
    states:
      - id: zemmour
        label: Zemmour
        probability: 0.88
        candidates: [zemmour_eric]
        description: >-
          Zemmour, candidature confirmée le 17 septembre 2026 sur BFMTV ; candidat en 2022
          avec ses parrainages.
        sources:
          - https://www.bfmtv.com/politique/elections/presidentielle/je-serai-candidat-eric-zemmour-annonce-sur-bfmtv-qu-il-se-presentera-a-l-election-presidentielle_AV-202609170947.html
      - id: knafo
        label: Knafo
        probability: 0.02
        candidates: [knafo_sarah]
        description: >-
          Knafo remplace Zemmour. Elle a déclaré le 29 avril 2026 ne pas être candidate et
          soutient Zemmour : branche résiduelle.
        sources:
          - https://www.franceinfo.fr/politique/pas-candidate-a-l-election-presidentielle-de-2027-sarah-knafo-lance-une-grande-consultation-des-francais_7970540.html
      - id: none
        label: Pas de candidat
        probability: 0.10
        candidates: []
        description: >-
          Pas de candidat Reconquête au premier tour (parrainages manqués ou retrait au profit
          du RN).
        sources: []

small_candidates:
  # --- far_right
