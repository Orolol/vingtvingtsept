        quote: "Jordan Bardella Vous êtes sûr(e) de voter pour lui/elle 17% 12% Vous voterez peut-être pour lui/elle 25% 25% Vous ne voterez probablement pas pour lui/elle 11% 14% Vous excluez de voter pour lui/elle 46% 48%"
