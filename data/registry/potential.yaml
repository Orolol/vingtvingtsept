# Potentiel électoral et rejet (« pourrait voter pour » / « exclut de voter pour »).
#
# Une entrée par sondage publié. Lu par `vvs.ingest.potential` (`vvs ingest potential` pour
# télécharger les bruts manquants dans data/raw/potential/, `vvs parse potential` pour écrire
# data/curated/electoral_potential.parquet).
#
# - `raw` : brut déjà présent sous data/raw (notices de la Commission des sondages) ; sinon le
#   brut est data/raw/potential/<id>.<ext>, téléchargé depuis `url`, jamais réécrit.
# - `parser` : tableaux lus par programme dans le brut (Toluna Harris Interactive) ; sinon
#   `rows` relevés à la main, chacun avec un extrait `quote` recopié du document. La
#   vérification cherche l'extrait dans le texte du brut et chaque chiffre dans l'extrait ;
#   `potential_parts` donne les modalités publiées quand le potentiel est leur somme.
# - `scale` et `potential_def` / `reject_def` : voir le docstring du module. Les mesures ne
#   sont pas comparables entre instituts telles quelles (normalisation : vvs.model.potential).
# - Valeurs en % ; base : `population` (registered = inscrits sur les listes).
#
# Relevé du 2026-10-20. AUCUN chiffre n'est complété de mémoire.

sources:
