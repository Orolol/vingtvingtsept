  # OpinionWay pour Le Figaro : quatre modalités, « sûr » sélectionnable une seule fois ;
  # potentiel = sûr + peut-être, rejet = « vous excluez » ; colonnes redressées.
  - id: opinionway_2026-06-08_lefigaro
    election: 2027
    pollster: opinionway
    sponsor: Le Figaro
    fieldwork_start: 2026-06-01
    fieldwork_end: 2026-06-08
    sample_size: 3057
    population: registered
    question: >-
      En 2027, au premier tour de l'élection présidentielle, pour chacun des candidats
      potentiels suivants, diriez-vous que… vous êtes sûr(e) de voter pour lui/elle / vous
      voterez peut-être pour lui/elle / vous ne voterez probablement pas pour lui/elle / vous
      excluez de voter pour lui/elle
    scale: four_level
    potential_def: sûr + peut-être, redressé (« sûr » une seule fois par répondant)
    reject_def: vous excluez de voter pour lui/elle, redressé
    url: http://www.commission-des-sondages.fr/notices/files/notices/2026/juillet/10218-pres-election-2027-opinionway-le-figaro-3-juillet.pdf
    raw: commission/2222.pdf
    notes: >-
      Base : 3 057 inscrits (échantillon total 3 598). Colonnes brut puis redressé ; on relève
      la seconde. Zemmour non relevé (« <1 % » sûr).
    rows:
      - candidate: melenchon_jean_luc
        potential: 15
        potential_parts: [6, 9]
        reject: 71
        firm: 6
        quote: "Jean-Luc Mélenchon Vous êtes sûr(e) de voter pour lui/elle 5% 6% Vous voterez peut-être pour lui/elle 9% 9% Vous ne voterez probablement pas pour lui/elle 11% 12% Vous excluez de voter pour lui/elle 73% 71%"
      - candidate: tondelier_marine
        potential: 10
        potential_parts: [1, 9]
        reject: 63
        firm: 1
        quote: "Marine Tondelier Vous êtes sûr(e) de voter pour lui/elle 1% 1% Vous voterez peut-être pour lui/elle 10% 9% Vous ne voterez probablement pas pour lui/elle 23% 25% Vous excluez de voter pour lui/elle 64% 63%"
      - candidate: hollande_francois
