  # Ipsos bva pour L'Opinion : quatre modalités ; « potentiel électoral » publié = certain +
  # fortes chances ; rejet = « aucune chance ».
  - id: ipsos_2025-11-28_lopinion
    election: 2027
    pollster: ipsos
    sponsor: L'Opinion
    fieldwork_start: 2025-11-25
    fieldwork_end: 2025-11-28
    sample_size: 1993
    population: registered
    question: >-
      Pour les candidats déclarés ou potentiels suivants à l'élection présidentielle de 2027,
      dites, s'il était candidat, si… vous êtes tout à fait certain de voter pour elle/lui / il y
      a de fortes chances… / il y a peu de chances… mais vous ne l'excluez pas / il n'y a aucune
      chance que vous votiez pour elle/lui
    scale: four_level
    potential_def: certain + fortes chances (sous-total « potentiel électoral » publié)
    reject_def: aucune chance
    url: http://www.commission-des-sondages.fr/notices/files/notices/2025/decembre/10027-pres-rn-ipsos-bva-lopinion-4-decembre.pdf
    raw: commission/2011.pdf
    notes: Colonnes du tableau dans l'ordre certain, fortes chances, peu de chances, aucune chance, sous-total.
    rows:
      - {candidate: le_pen_marine, potential: 36, reject: 51, firm: 18, quote: "Marine Le Pen 18 18 13 51 36%"}
      - {candidate: bardella_jordan, potential: 38, reject: 49, firm: 19, quote: "Jordan Bardella 19 19 13 49 38%"}
  # Cluster17 pour Marianne : probabilité de vote de 0 à 10 ; potentiel élevé / certain = 7 à
  # 10, vote impossible ou presque = 0 à 3 ; colonnes redressées.
  - id: cluster17_2026-01-02_marianne
    election: 2027
    pollster: cluster17
    sponsor: Marianne
    fieldwork_start: 2026-01-01
    fieldwork_end: 2026-01-02
    sample_size: 1522
    population: unknown
    question: >-
      Si les personnalités suivantes étaient candidates à l'élection présidentielle, quelle
      serait la probabilité pour que vous votiez pour elles ? 0 = aucune chance de voter pour
      cette personnalité / 10 = certain de voter pour elle
    scale: zero_ten
    potential_def: notes 7 à 10 (« potentiel élevé / certain »), redressé
    reject_def: notes 0 à 3 (« vote impossible ou presque »), redressé
    url: http://www.commission-des-sondages.fr/notices/files/notices/2026/janvier/10049-pres-potentiel-vote-rn-cluster-17-marianne-14-janvier.pdf
    raw: commission/2035.pdf
