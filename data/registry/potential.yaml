        potential_parts: [2, 17]
        reject: 55
        firm: 2
        quote: "François Hollande Vous êtes sûr(e) de voter pour lui/elle 2% 2% Vous voterez peut-être pour lui/elle 18% 17% Vous ne voterez probablement pas pour lui/elle 22% 24% Vous excluez de voter pour lui/elle 56% 55%"
      - candidate: glucksmann_raphael
        potential: 17
        potential_parts: [1, 16]
        reject: 53
        firm: 1
        quote: "Raphaël Glucksmann Vous êtes sûr(e) de voter pour lui/elle 3% 1% Vous voterez peut-être pour lui/elle 19% 16% Vous ne voterez probablement pas pour lui/elle 24% 28% Vous excluez de voter pour lui/elle 52% 53%"
      - candidate: attal_gabriel
        potential: 27
        potential_parts: [2, 25]
        reject: 48
        firm: 2
        quote: "Gabriel Attal Vous êtes sûr(e) de voter pour lui/elle 2% 2% Vous voterez peut-être pour lui/elle 25% 25% Vous ne voterez probablement pas pour lui/elle 24% 23% Vous excluez de voter pour lui/elle 48% 48%"
      - candidate: philippe_edouard
        potential: 31
        potential_parts: [4, 27]
        reject: 45
        firm: 4
        quote: "Edouard Philippe Vous êtes sûr(e) de voter pour lui/elle 5% 4% Vous voterez peut-être pour lui/elle 26% 27% Vous ne voterez probablement pas pour lui/elle 22% 22% Vous excluez de voter pour lui/elle 45% 45%"
      - candidate: retailleau_bruno
        potential: 22
        potential_parts: [2, 20]
        reject: 52
        firm: 2
        quote: "Bruno Retailleau Vous êtes sûr(e) de voter pour lui/elle 2% 2% Vous voterez peut-être pour lui/elle 22% 20% Vous ne voterez probablement pas pour lui/elle 24% 24% Vous excluez de voter pour lui/elle 50% 52%"
      - candidate: bardella_jordan
