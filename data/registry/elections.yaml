# Élections présidentielles : dates, candidats officiels (parti, bloc), résultats nationaux.
#
# Résultats : décisions du Conseil constitutionnel (déclaration des résultats du premier tour,
# proclamation des résultats du second), relevées le 2026-10-20 sur conseil-constitutionnel.fr.
# `votes`, `registered`, `voters`, `expressed`, `blank_ballots`, `null_ballots` sont recopiés
# tels quels ; le CC ne publie pas de pourcentages : `share` = 100 * votes / expressed,
# arrondi à deux décimales (convention du ministère). Les blancs et nuls ne sont détaillés par
# le CC qu'à partir de 2017 (blancs) et 2022 (nuls) ; absents = non publiés dans la décision.
#
# `date` = dimanche du scrutin en métropole. Les blocs suivent data/registry/blocs.yaml.

