# Personnes : candidats officiels aux présidentielles 2002-2022, candidats déclarés ou
# plausibles pour 2027. Clé = candidate_id (voir README.md).
#
# `parties` : affiliations successives, `from` / `to` en années incluses, `null` = inconnu
# (pour `from`) ou en cours (pour `to`). Une affiliation peut en chevaucher une autre
# (alliance Front de gauche et Parti de gauche). Le loader vérifie que le parti de chaque
# candidature dans elections.yaml figure ici, actif l'année de l'élection.
# Affiliations relevées de mémoire : les années anciennes et les mouvements récents (2024-2026)
# sont à recouper avant tout usage fin ; les notes signalent les points douteux.

