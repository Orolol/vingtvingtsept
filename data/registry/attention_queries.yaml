# Signaux d'attention en ligne par candidat : article Wikipédia FR (pages vues) et sujet
# Google Trends. Lu par vvs.ingest.attention.load_registry ; les clés de `candidates` sont des
# ids de candidates.yaml (vérifié au chargement), les dates de premier tour viennent
# d'elections.yaml.
#
# Couverture : candidats officiels de 2002 à 2022, candidats testés au premier tour dans les
# sondages des cycles 2017, 2022 et 2027 (poll_results.parquet, au moins un sondage), et
# candidats des scénarios 2027 (scenarios_2027.yaml). Relevé du 2026-10-20.
#
# candidates.<id>.wikipedia.title : titre exact de l'article sur fr.wikipedia à la date du
#   relevé (aucun n'était une redirection ni une page d'homonymie). Les anciens titres
#   (renommages) sont retrouvés automatiquement par l'ingestion ; `extra_titles` ajoute à la
#   main un titre que la recherche automatique ne voit pas. `null` : pas d'article.
# candidates.<id>.trends : `topic` = sujet Trends (identifiant Knowledge Graph) proposé par
#   l'autocomplétion de trends.google.com le 2026-10-20 pour le nom du candidat, le premier
#   sujet au nom exact qui désigne une personne (type en commentaire) ; à défaut `keyword`
#   = le nom, recherché comme mot-clé.
# cycles.<élection> : membres du cycle, dénominateur de `share` dans attention.parquet.
#   2007 et 2012 : candidats officiels (Trends seulement, les pages vues commencent en
#   juillet 2015). 2017, 2022, 2027 : candidats testés dans au moins un sondage du cycle et
#   candidats officiels ; 2027 sans Emmanuel Macron (non rééligible, testé en 2022-2023),
#   avec les candidats des scénarios.

wikipedia:
  start: 2015-07-01  # début de l'API Pageviews

trends:
  start: 2004-01-01  # début des séries Google Trends
  # Pivot du chaînage entre lots et entre fenêtres (vvs.ingest.attention.google_trends) :
  # présent dans le débat de 2002 à 2026 (candidat 2002, 2007, 2012, allié de Macron, Premier
  # ministre 2024-2025), à un niveau de recherche moyen, ni écrasé ni écrasant.
  pivot: bayrou_francois

