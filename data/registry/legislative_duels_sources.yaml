        sha256: cf3827f8d14df369a7821d02323ab0aff6031e3e9bf64d62c3a54a96c1545d93
        notes: >-
          latin-1, « ; », CRLF, une ligne par circonscription : 19 colonnes fixes (dont
          inscrits, votants, blancs, nuls, exprimés) puis blocs de 9 (panneau, sexe, nom,
          prénom, nuance, voix, % ins, % exp, sièges). Départements sur 2 caractères,
          outre-mer et étranger en Z*.
      - name: resultats-par-niveau-cirlg-t2-france-entiere.txt
        round: 2
        format: leg2022_cirlg
        url: https://static.data.gouv.fr/resources/elections-legislatives-des-12-et-19-juin-2022-resultats-definitifs-du-second-tour/20220621-175613/resultats-par-niveau-cirlg-t2-france-entiere.txt
