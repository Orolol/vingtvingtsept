        sha256: 0878a6943a609cf489c7af1f52e38e9152d788995c76ecbba58eb75926962fc7
        notes: Même format ; seules les circonscriptions ayant un second tour.
  leg2024:
    year: 2024
    files:
      - name: resultats-definitifs-par-circonscriptions-legislatives-t1.csv
        round: 1
        format: leg2024_circ
        url: https://static.data.gouv.fr/resources/elections-legislatives-des-30-juin-et-7-juillet-2024-resultats-definitifs-du-1er-tour/20240710-171413/resultats-definitifs-par-circonscriptions-legislatives.csv
        dataset: https://www.data.gouv.fr/fr/datasets/6682d0c255dcda5df20b1d90/
        sha256: dbeb0214bc9f54d44d4641400177ea93203b0b90d35485a2b4ed4fc3c300ab3f
        notes: >-
          UTF-8, « ; », sans guillemets, pourcentages suffixés « % » ; 18 colonnes fixes puis
          blocs de 9 (panneau, nuance, nom, prénom, sexe, voix, % ins, % exp, élu). Code
          département sans zéro initial (« 1 »), circonscription « 101 », outre-mer en 97x/98x,
          ZX et ZZ.
      - name: resultats-definitifs-par-circonscription-t2.csv
        round: 2
        format: leg2024_circ
        url: https://static.data.gouv.fr/resources/elections-legislatives-des-30-juin-et-7-juillet-2024-resultats-definitifs-du-2nd-tour/20240710-170728/resultats-definitifs-par-circonscription.csv
        dataset: https://www.data.gouv.fr/fr/datasets/668b4092826ddcf70e9e62cd/
        sha256: bcc062b9264dcf3dc1eac5463acf1e8743171b86385923e7f770fd9028271083
        notes: >-
          Même découpage de colonnes que le T1, mais champs texte entre guillemets, code
          département sur 2 caractères (« 01 ») et circonscription « 0101 ».

