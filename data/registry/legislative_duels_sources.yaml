# Sources des duels de second tour des législatives 2022 et 2024 (étude duel RN contre LFI,
# docs/results/2026-11-24-duel-rn-lfi.md). Lu par vvs.ingest.legislative_duels :
#   uv run --project back python -m vvs.ingest.legislative_duels ingest   # télécharge dans data/raw/legislative_duels/
#   uv run --project back python -m vvs.ingest.legislative_duels parse    # écrit data/curated/legislative_*.parquet
#
# Fichiers du ministère de l'Intérieur (data.gouv.fr), un par tour, niveau circonscription
# législative ; empreintes sha256 relevées au premier téléchargement (2026-11-24) et vérifiées
# ensuite. Un fichier présent n'est jamais réécrit (data/raw immuable).
#
# Appartenance partisane des candidats d'union de la gauche : le ministère ne donne que la
# nuance (NUP en 2022, UG en 2024), pas le parti. Sources retenues :
# - 2022 : tableau « Répartition par circonscription » de l'article Wikipédia de la NUPES
#   (couleur de parti par circonscription, d'après les listes d'investiture de la NUPES, de LFI,
#   du PCF et d'EELV citées par l'article) ; contrôle : pages Wikipédia départementales ;
# - 2024 : colonne « Parti et coalition » des pages Wikipédia départementales (une ligne par
#   candidat, appariée au ministère par les voix de premier tour) ; contrôle indépendant :
#   répartition des circonscriptions de l'accord du Nouveau Front populaire (fichier diffusé
#   dans la presse le 14 juin 2024, mis en CSV sur data.gouv.fr par un particulier, non
#   officiel, avant les dernières corrections d'investiture).
# Les pages Wikipédia sont figées par leur numéro de révision (oldid) relevé le 2026-11-24.
# Les pages de Wallis-et-Futuna, de Saint-Martin/Saint-Barthélemy et des Français de
# l'étranger n'ont pas été trouvées sous le titre attendu : sans parti, leurs candidats
# d'union restent `unknown`.

results:
  leg2022:
    year: 2022
    files:
      - name: resultats-par-niveau-cirlg-t1-france-entiere.txt
        round: 1
        format: leg2022_cirlg
        url: https://static.data.gouv.fr/resources/elections-legislatives-des-12-et-19-juin-2022-resultats-definitifs-du-premier-tour/20220614-192511/resultats-par-niveau-cirlg-t1-france-entiere.txt
