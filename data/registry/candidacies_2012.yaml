# Registre historique daté des candidatures — présidentielle 2012 (docs/12, lot 1).
# Validé et interrogé par `vvs.registry.candidacies` (`load_candidacies(2012)`, `state_at`).
#
# Structure (commune à candidacies_<année>.yaml ; reprise telle quelle pour 2027) :
# - `collection` : sources et périodes parcourues d'avance pour constituer la liste des
#   personnes, et règle d'exclusion. La liste des candidats finalement présents n'a pas servi
#   de liste de collecte.
# - `references` : alias -> {url, title, outlet, published}. `published` = date de mise en
#   ligne de la source (pour une révision Wikipédia : date UTC de son horodatage).
# - `persons` : `id` (candidate_id ; hors candidates.yaml, `name`, `first_name`, `last_name`
#   obligatoires et id = candidate_id_for(nom, prénom)), `party` (id de parties.yaml) ou
#   `party_label` (texte libre), `bloc` au moment de l'élection, `final_status` :
#   `official` (liste du Conseil constitutionnel), `declared_absent` (déclaré ou engagé dans
#   une primaire, absent de la liste), `never_declared` (seulement envisagé ou pressenti).
# - `processes` : primaires, congrès, consultations à plusieurs participants. `rounds` : date
#   du vote, date de publication du résultat, `qualified` = participants encore en lice après
#   ce tour (le dernier ne qualifie que le vainqueur). Le chargeur en déduit les sorties
#   (`primary_exit`) et la désignation : le vainqueur exclut les autres participants, et
#   seulement eux, sauf engagement documenté (`commitments` : non-participant qui s'est engagé
#   à ne pas se présenter si l'un des `winners` l'emporte).
# - `events` : `type` parmi mention (personne publiquement envisagée ou qui dit envisager),
#   declaration, primary_entry, primary_exit, designation, investiture, sponsorship_filing,
#   withdrawal (retrait d'une candidature déclarée), renouncement (renoncement sans déclaration
#   préalable), official_list ; `date` = jour de l'événement (null si seule la publication est
#   connue), `published` = jour où l'information devient publique, `published_basis` =
#   `source` (date de la source la plus ancienne citée), `wikipedia_revision` (horodatage de
#   la première révision consultée qui l'enregistre : borne par excès) ou `imputed`
#   (`imputation` obligatoire) ; `events_yaml` renvoie à l'événement correspondant de
#   events.yaml sans le dupliquer.
#
# Lecture : `state_at(date)` n'utilise que les événements publiés strictement avant la date.
# Les données restent reconstruites en 2026 à partir de sources contemporaines datées ; une
# date de première trace est celle des sources parcourues, pas la première trace réelle.

election: 2017
#
# Particularités 2012 : les deux pages françaises sont parcourues dès le 1er janvier 2011 (la
# page « Candidatures » existe dès janvier 2011) ; les tableaux de résultats de 2007 inclus dans
# la page « Élection » (Voynet, Bové, Laguiller…) ne valent pas mention. Les désignations
# internes (LO, FN, NPA, Génération écologie, Bloc identitaire, Union de la droite nationale)
# sont des `investiture` hors processus, sauf quand une source montre plusieurs participants
# (congrès FN de Tours, conférence nationale du NPA : voir `notes` des processus).

election: 2012

collection:
  collected_on: 2026-10-23
  protocol: >-
    Liste des personnes : tout nom qui apparaît, dans les sources ci-dessous et pendant la
    période, comme candidat déclaré (à l'élection ou à une primaire), candidat à la
    candidature, personnalité pressentie, ayant exprimé son intérêt, évoquée par les
    commentateurs, ou ayant décliné. Instantanés Wikipédia : révision en vigueur à 00:00 UTC
    le 1er et le 15 de chaque mois, aux quatre dates du backtest 2012 et le jour de la liste
    officielle (back/studies/candidacies_wikipedia.py, manifeste et empreintes dans
    runs/2026-10-23-candidacies/wikipedia/). Dossier de presse : un article de presse
    nationale « qui sont les candidats » publié dans les 30 jours avant chacune des quatre
    dates du backtest (60 jours si aucun). Les dates des déclarations, retraits et
    désignations viennent des articles de presse cités par ces révisions ou retrouvés
    ensuite ; à défaut, de la révision elle-même (borne par excès). Les candidats à la
    candidature d'une primaire qui n'ont pas déposé leur candidature à la clôture des dépôts
    sont retirés à la date de l'article qui publie la liste close (règle propre à ce fichier,
    voir les `note`).
  sources:
    - id: wp_fr_election
      kind: wikipedia_revisions
      title: Élection présidentielle française de 2012
      url: https://fr.wikipedia.org/wiki/%C3%89lection_pr%C3%A9sidentielle_fran%C3%A7aise_de_2012
      period: [2011-01-01, 2012-04-22]
      cadence: 1er et 15 du mois, 2011-10-25, 2012-01-23, 2012-03-19 (liste), 2012-03-23, 2012-04-15
      note: Sections dont le titre contient « candidat » ou « primaire ».
    - id: wp_fr_candidacies
      kind: wikipedia_revisions
      title: Candidatures à l'élection présidentielle française de 2012
      url: https://fr.wikipedia.org/wiki/Candidatures_%C3%A0_l%27%C3%A9lection_pr%C3%A9sidentielle_fran%C3%A7aise_de_2012
      period: [2011-01-01, 2012-04-22]
      cadence: idem
      note: Page entière hors notes, sondages et articles connexes ; première révision retenue le 2011-01-30.
    - id: wp_en_election
      kind: wikipedia_revisions
      title: 2012 French presidential election
      url: https://en.wikipedia.org/wiki/2012_French_presidential_election
      period: [2011-01-01, 2012-04-22]
      cadence: idem
      note: Sections « candidates » et « primary » ; n'a ajouté aucune personne retenue.
    - id: press_dossiers
      kind: press
      title: Dossier de presse aux dates du backtest
      period: [2011-09-25, 2012-04-15]
      note: >-
        Le Figaro, « Quatorze candidats dans la course à l'Élysée » (2011-10-19, capture
        2011-10-24) ; Le Nouvel Observateur, « Les principaux candidats déclarés ou probables à la
        présidentielle 2012 » (2011-12-25, capture 2012-01-08) ; Le Monde, « Dix candidats
        engagés dans la course à l'Elysée » (2012-03-19) et « Qui cherche encore des
        parrainages ? » (2012-03-16), lus en capture web.archive.org. Aucun nom absent des
        révisions Wikipédia.
    - id: press_followup
      kind: press
      title: Articles retrouvés après coup pour dater les transitions
      period: [2009-06-01, 2012-03-19]
      note: >-
        Recherche ciblée (WebSearch, archives web.archive.org, sites des médias) des articles
        datant une déclaration, un ralliement ou un retrait quand la révision Wikipédia ne cite
        pas de source datée ; chaque article est une référence ci-dessous.
    - id: wp_primaries
      kind: wikipedia_page
      title: Pages des primaires (citoyenne PS-PRG 2011, écologiste 2011, consultation du PCF 2011)
      note: Version courante, pour les participants et les tours ; dates vérifiées sur la presse citée.
    - id: cc_list
      kind: official
      title: Décision n° 2012-145 PDR du 19 mars 2012
      url: https://www.conseil-constitutionnel.fr/decision/2012/2012145PDR.htm
  exclusions: >-
    Écartés de la liste : personnalités étrangères (Evo Morales, Hugo Chávez, Lula, Rafael
    Correa) ou historiques (Georges Marchais, Charles de Gaulle, Konrad Adenauer) ; candidats
    de scrutins antérieurs cités dans les tableaux de résultats (Arlette Laguiller, Dominique
    Voynet, José Bové) ; journalistes, soutiens, porte-parole, organisateurs et dirigeants qui
    commentent (Jean-Jacques Bourdin, Fabrice Robert, Jean-Luc Laurent, Annick Martin, Robert
    Spieler, Martin Hirsch, Bruno Gaccio, Stéphane Ayrault, Antoine Waechter, Jean-Christophe
    Lagarde, Jean-Marie Bockel, Patrick Balkany, François Baroin, Jean Leonetti, Michèle
    Alliot-Marie, Brigitte Girardin) ; candidatures fictives ou symboliques (Christophe
    Alévêque et son personnage « Super Rebelle », Marion Cotillard, Mélanie Laurent, Zaz et
    Pierre Rabhi dans la campagne « Tous candidats », Éric Cantona, dont la démarche est
    présentée dès la première source comme non candidate).

