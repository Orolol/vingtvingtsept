processes:
  - id: primaire_citoyenne_2011
    name: "Primaire citoyenne PS-PRG de 2011"
    kind: citizen_primary
    organizers: [ps, prg]
    participants: [hollande_francois, aubry_martine, montebourg_arnaud, royal_segolene, valls_manuel, baylet_jean_michel]
    winner: hollande_francois
    events_yaml: ps_primary_2011
    sources: [europe1_20110713_primaire]
    notes: "Dépôt des candidatures clos le 13 juillet 2011 ; six candidats. Résultats du premier tour connus le soir du 9 octobre, publication retenue au 10 (article cité) ; second tour le 16 octobre."
    rounds:
      - {date: 2011-10-09, published: 2011-10-10, qualified: [hollande_francois, aubry_martine], sources: [lejdd_20111010_primaire], note: "Hollande 39,17 %, Aubry 30,42 %, Montebourg 17,19 %, Valls 5,63 %, Royal 6,95 %, Baylet 0,64 %."}
      - {date: 2011-10-16, published: 2011-10-16, qualified: [hollande_francois], sources: [lejdd_20111016_primaire], note: "Hollande 56,57 %, Aubry 43,43 %."}
  - id: primaire_eelv_2011
    name: "Primaire présidentielle de l'écologie (EELV) 2011"
    kind: closed_primary
    organizers: [eelv]
    participants: [joly_eva, hulot_nicolas, lhomme_stephane, stoll_henri]
    winner: joly_eva
    sources: [politis_20110523_primaire]
    notes: "Vote des adhérents et coopérateurs ; date du premier tour = proclamation des résultats (29 juin 2011), second tour proclamé le 12 juillet 2011."
    rounds:
      - {date: 2011-06-29, published: 2011-06-29, qualified: [joly_eva, hulot_nicolas], sources: [politis_20110629_primaire], note: "Joly 49,75 %, Hulot 40,22 %, Stoll 5,02 %, Lhomme 4,64 % (Politis)."}
      - {date: 2011-07-12, published: 2011-07-12, qualified: [joly_eva], sources: [lejdd_20110712_joly], note: "Joly 58,16 %."}
  - id: consultation_pcf_2011
    name: "Consultation des militants communistes (juin 2011)"
    kind: members_vote
    organizers: [pcf]
    participants: [melenchon_jean_luc, chassaigne_andre, dang_tran_emmanuel]
    winner: melenchon_jean_luc
    notes: "Le conseil national du 8 avril 2011 retient quatre candidatures (Mélenchon, Chassaigne, Gerin, Dang Tran) ; Gerin se désiste le 5 juin pour Chassaigne et ne concourt pas. Vote des militants du 16 au 18 juin 2011. Le communiqué de désignation du JDD (dépêche « Front de gauche : Mélenchon enfin désigné par le PCF ») n'est pas daté sur sa capture."
    rounds:
      - {date: 2011-06-18, published: 2011-06-18, qualified: [melenchon_jean_luc], sources: [politis_20110618_pcf], note: "Mélenchon 59,12 %."}
  - id: congres_fn_2011
    name: "Congrès du Front national à Tours (janvier 2011)"
    kind: congress
    organizers: [fn]
    participants: [le_pen_marine, gollnisch_bruno]
    winner: le_pen_marine
    notes: "Élection du président du FN par les adhérents. Les commentateurs y voient la désignation du candidat et Marine Le Pen dit que le vainqueur représentera le parti ; Gollnisch distinguait les deux échéances. Modélisé comme processus (doute signalé) ; investiture formelle le 16 mai 2011."
    rounds:
      - {date: 2011-01-16, published: 2011-01-16, qualified: [le_pen_marine], sources: [europe1_20110116_fn], note: "Marine Le Pen 67,65 %, Gollnisch 32,35 %."}
  - id: conference_npa_2011
    name: "Conférence nationale du NPA (juin 2011)"
    kind: council
    organizers: [npa]
    participants: [poutou_philippe, martin_myriam, poupin_christine, louail_regis]
    winner: poutou_philippe
    notes: "Le 17 juin 2011 le NPA « hésite entre quatre candidats » ; la commission des candidatures propose Poutou, ratifié par la conférence nationale le 25 juin (122 pour, 50 contre). Aucun scrutin concurrent n'est rapporté : participation des trois autres admise sur la foi de la dépêche du 17 juin (doute signalé)."
    rounds:
      - {date: 2011-06-25, published: 2011-06-25, qualified: [poutou_philippe], sources: [lejdd_20110625_npa, europe1_20110625_poutou]}

