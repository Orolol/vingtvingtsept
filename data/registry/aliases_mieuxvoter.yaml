# Alias des libellés de la source MieuxVoter/presidentielle2027 -> ids du registre.
#
# Lu par vvs.ingest.mieuxvoter.load_aliases. Les clés sont comparées après normalisation
# (ASCII minuscule, tirets et apostrophes en espaces, comme pour aliases_wikipedia.yaml) :
# « Jean-Luc Mélenchon » et « jean luc melenchon » sont la même clé.
# Un libellé absent fait échouer le parsing : on complète ce fichier, on ne devine pas.
#
# candidates : champ `candidat` du JSON (prénom nom, tel que dans candidats.csv du dépôt).
#   Convention d'id (data/registry/README.md) : nom_prenom ASCII, particule conservée
#   (de_villepin_dominique, de_villiers_philippe). Le parseur vérifie en plus que l'id vaut
#   candidate_id_for(surname, name) avec les champs du JSON : une erreur de table ou un
#   changement de personne derrière un libellé fait échouer le parsing.
#
# pollsters : champ `institut` du JSON -> id court de pollsters.yaml. Le commanditaire est
#   un champ séparé (`commanditaire`) dans cette source, jamais accolé à l'institut.
#   « Ipsos BVA » : Ipsos depuis l'absorption de BVA en 2024 (voir pollsters.yaml).

