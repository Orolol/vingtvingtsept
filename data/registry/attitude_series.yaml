# Séries longues d'attitudes et d'opinion (contexte, site ; aucune n'entre dans la prévision).
#
# Lu par vvs.ingest.attitudes : `vvs ingest attitudes [--series X]` télécharge les documents
# dans data/raw/attitudes/<group>/<id>.<ext> (+ <id>.meta.json : URL, heure UTC, sha256 ; jamais
# réécrit) ; `vvs parse attitudes [--series X]` lit les valeurs et écrit
# data/curated/attitudes.parquet (series_id, date, value, freq, source, unit, population, notes,
# wave, fieldwork_start, fieldwork_end, method, document, page, raw_sha256).
#
# Sections :
#   documents    un document téléchargé : url (vérifiée le 2026-10-23), group (sous-dossier
#                brut), ext, éditeur, terrain, échantillon, mode, notes
#   waves        par famille, dates de terrain des vagues « AAAA-MM » lues dans un document
#                (`quote` vérifié dans le texte de la page) ; une vague absente est datée du 1er
#                du mois affiché sur l'axe des graphiques
#   series       une série publiée : formulation exacte de la question (`question`), modalité
#                comptée (`answer`), population (codes ci-dessous), changements de formulation
#                ou de méthode (`changes`), ce qui n'a pas pu être obtenu (`missing`)
#   extractions  comment lire les valeurs, dans l'ordre de priorité : pour une même série et une
#                même vague, la première extraction fait foi, les suivantes sont des contrôles
#                (désaccords listés par `vvs parse attitudes`)
#
# Extractions (voir vvs/ingest/attitudes/pdfchart.py et extract.py) :
#   chart   graphique d'évolution d'un PDF : étiquettes de valeur lues dans la couche texte,
#           séries séparées par leur couleur de texte (RVB 0-1), vagues par colonne. `columns:
#           axis` lit les vagues sur l'axe (texte) ; `columns: cluster` quand l'axe est une
#           image : `waves` est alors la liste des vagues lue sur l'axe du graphique (rendu de la
#           page), et le nombre de colonnes trouvées doit lui être égal. Coordonnées en points
#           PDF, origine en haut à gauche : bbox = [x0, haut, x1, bas]. `exclusive` : modalités
#           d'une même question, somme ≤ 100 % par vague.
#   table   tableau items × vagues d'un PDF (en-têtes « Mai 2000 », « Nov. 2023 »)
#   quote   chiffre recopié avec son extrait `quote`, vérifié dans le texte de la page ;
#           `derived_from_delta` : valeur ancienne = valeur imprimée - écart imprimé
#   eurobarometer, drees_microdata, cncdh_chart : parseurs propres à ces sources
#
# Populations : fr_adults_18plus (France, 18 ans et plus, quotas), fr_registered_18plus
# (inscrits sur les listes, 18 ans et plus), fr_metro_adults_18plus (France métropolitaine ou
# hexagonale, 18 ans et plus), fr_adults_15plus (France, 15 ans et plus, Eurobaromètre).
#
# AUCUNE valeur n'est saisie de mémoire. Relevé du 2026-10-23.

documents:
