series:
  # ------------------------------------------------------------------- baromètre d'image du RN
  - series_id: rn_danger_democracy_yes
    family: rn_image
    label: Le FN/RN représente un danger pour la démocratie (oui)
    question: Pensez-vous que le Rassemblement National représente un danger pour la démocratie en France ?
    answer: Oui, il représente un danger
    source: verian
    freq: wave
    unit: percent
    population: fr_adults_18plus
    since: 1983-10
    changes: >-
      Front national jusqu'à la vague de février 2018, Rassemblement national ensuite (même
      question). Instituts successifs (voir le commentaire des documents). Face-à-face au domicile
      jusqu'en novembre 2024, en ligne sur panel en janvier 2026 (Verian : « évolutions à
      considérer avec précaution »). Rythme annuel irrégulier (axe du graphique de l'édition
      2026) : aucune vague en 1986, 1992, 1995, 2001, 2007-2009 ni 2025, deux en 2022 (janvier
      et décembre).
    missing: >-
      Dates de terrain exactes avant janvier 2022 : seul le mois est publié sur l'axe des
      graphiques (les éditions TNS Sofres et Kantar 2013-2021 ne sont pas téléchargeables sans
      compte). Pas de question sur le vote « barrage » au second tour avant 2026 (voir
      rn_barrage_withdrawal_agree).
  - series_id: rn_danger_democracy_no
    family: rn_image
    label: Le FN/RN ne représente pas un danger pour la démocratie
    question: Pensez-vous que le Rassemblement National représente un danger pour la démocratie en France ?
    answer: Non, il ne représente pas un danger
    source: verian
    freq: wave
    unit: percent
    population: fr_adults_18plus
    since: 1983-10
    changes: voir rn_danger_democracy_yes
  - series_id: rn_ideas_agree
    family: rn_image
    label: Adhésion aux idées du FN/RN (total d'accord)
    question: >-
      Diriez-vous que vous êtes tout à fait d'accord, assez d'accord, plutôt en désaccord ou
      tout à fait en désaccord avec les idées défendues par le Rassemblement National ?
    answer: Total d'accord (tout à fait + assez d'accord)
    source: verian
    freq: wave
    unit: percent
    population: fr_adults_18plus
    since: 1984-11
    changes: voir rn_danger_democracy_yes (série commencée en novembre 1984)
  - series_id: rn_ideas_disagree
    family: rn_image
    label: Désaccord avec les idées du FN/RN (total en désaccord)
    question: >-
      Diriez-vous que vous êtes tout à fait d'accord, assez d'accord, plutôt en désaccord ou
      tout à fait en désaccord avec les idées défendues par le Rassemblement National ?
    answer: Total en désaccord
    source: verian
    freq: wave
    unit: percent
    population: fr_adults_18plus
    since: 1984-11
    changes: voir rn_danger_democracy_yes
  - series_id: rn_can_join_government
