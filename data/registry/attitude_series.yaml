    question: >-
      Que vous soyez en accord ou en désaccord avec les idées du Rassemblement National, selon
      vous : c'est un parti qui a la capacité de participer à un gouvernement / c'est seulement
      un parti qui a vocation à rassembler les votes d'opposition
    answer: C'est un parti qui a la capacité de participer à un gouvernement
    source: verian
    freq: wave
    unit: percent
    population: fr_adults_18plus
    since: 2011-01
    changes: >-
      Question posée depuis janvier 2011 (Front national puis Rassemblement national). C'est la
      seule mesure « capable de gouverner » du baromètre dans les documents obtenus.
    missing: >-
      Aucune question « le FN est capable de gouverner le pays » avant 2011 dans les éditions
      téléchargées.
