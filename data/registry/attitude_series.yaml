    question: >-
      QA3a. What do you think are the two most important issues facing (OUR COUNTRY) at the
      moment? (MAX. 2 ANSWERS) / A votre avis, quels sont les deux problèmes les plus importants
      auxquels doit faire face (NOTRE PAYS) actuellement ? (numéro QA3a ou QA3 depuis 2014,
