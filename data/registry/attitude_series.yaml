  # --------------------------------------------------------- CNCDH, indice longitudinal de tolérance
  - series_id: cncdh_tolerance_index
    family: cncdh
    label: Indice longitudinal de tolérance (CNCDH, V. Tiberj), 0 à 100
    question: >-
      Indice synthétique (méthode de J. Stimson) de 75 séries de questions du baromètre racisme
      de la CNCDH sur la tolérance envers les minorités, l'immigration et le multiculturalisme ;
      chaque série vaut la part des réponses tolérantes parmi les réponses tolérantes et
      intolérantes (rapport 2025, p. 257).
    answer: valeur annuelle de l'indice (0 = jamais la réponse tolérante, 100 = toujours)
    source: cncdh
    freq: A
    unit: index_0_100
    population: fr_metro_adults_18plus
    since: 1990
    changes: >-
      Indice créé en 2008 et recalculé chaque année sur toute la période : les éditions
      successives ne sont pas cumulables (le rapport 2024 donne 2023 = 62 et 2024 = 63, le
      rapport 2025 donne 63 et 64). Recalibrage de 5 séries en novembre 2022 (moyenne de l'ILT
      ramenée de 58 à 56). Enquête en face-à-face, terrain en novembre-décembre de l'année
      (25 novembre au 12 décembre 2025) : la date curated est le 1er janvier de l'année
      d'enquête. Pas d'enquête en 2020 ; l'enquête en ligne de mars 2021 n'est pas sur la courbe.
    missing: >-
      1992, 2020 et 2021 absents de la courbe. Sous-indices par minorité (Juifs, islam et
      musulmans, Maghrébins, Noirs, Roms ; figure 18 p. 269) publiés seulement en petits
      graphiques sans étiquettes annuelles (une seule valeur imprimée par graphique) : non
      extraits, l'appariement des marqueurs aux années n'étant pas univoque.

