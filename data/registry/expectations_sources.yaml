# Questions d'anticipation des sondages publiés (« qui sera élu ? », « X peut-il remporter
# l'élection ? », souhait de victoire, « ferait un bon président »), lues par
# `vvs.ingest.expectations` (commandes `vvs ingest expectations`, `vvs parse expectations`).
#
# Relevé du 2026-10-22 : recherche plein texte des 916 notices 2017 et 2022, des notices
# 2025-2026 et des rapports quotidiens du rolling Ifop 2022, plus une recherche web (sites des
# instituts, presse, Wikipédia) pour 2007, 2012, 2022 et 2027. Les questions trouvées dans un
# questionnaire sans résultats déposés (Elabe, Odoxa 2022, Toluna Harris Interactive 2017) ne
# figurent ici que si les résultats ont été retrouvés ailleurs.
#
# Champs communs :
#   election, question_type (winner | chances | wish | good_president),
#   population (all : ensemble de l'échantillon ; registered : inscrits ; certain_voters),
#   layout : forme du tableau
#     list       « Candidat v1 v2 … », colonnes choisies par `measures` ;
#     split_name prénom, valeur, NOM (rapports du rolling Ifop 2022) ;
#     attribute  bloc par candidat puis une ligne par qualité, celle qui contient `item` ;
#     labels     un seul candidat (`candidate`), somme des modalités `label` (« ^oui ») ;
#     manual     valeurs recopiées dans `values` (graphique, colonnes mêlées par la mise en
#                page) ; chaque nombre doit figurer sur la page ou dans la copie brute ;
#   measures : [{outcome: win | qualify, columns: [indices sommés]}], défaut win, colonne 0 ;
#     colonne -1 : dernière valeur de la ligne (sous-total) ;
#   anchor / stop : regex (texte normalisé ASCII minuscule) bornant les lignes lues ;
#   n_candidates : nombre de candidats attendu (contrôle) ; row_total : colonnes qui doivent
#   sommer à 100 sur chaque ligne (contrôle) ; drop : lignes illisibles écartées par règle ;
#   pair : pronostic de duel (entre les deux tours ou conditionnel) ;
#   fieldwork [début, fin], sample_size, pollster, sponsor : surchargent les métadonnées lues ;
#   verified : mesure relue à la main sur le document.

