# Événements de campagne : primaires et désignations, déclarations de candidature, retraits,
# chocs. Entrée de l'étude des rebonds (back/studies/bounce.py) et de la dérive μ de rebond
# (back/src/vvs/model/bounce.py, option désactivée par défaut). Validé par
# `vvs.model.bounce.load_events` (types, dates, candidats et blocs du registre).
#
# Champs :
# - `id` : identifiant stable ; `election` : présidentielle concernée ;
# - `type` : `primary` (primaire ou désignation par un parti, le candidat est le vainqueur),
#   `declaration` (déclaration de candidature), `withdrawal` (retrait ou renoncement, le
#   candidat est celui qui se retire), `shock` (affaire, ralliement, meeting raté…) ;
# - `date` : jour de l'événement (résultat du dernier tour pour une primaire) ;
# - `first_round` (primaires à deux tours) : résultat du premier tour ; le niveau d'avant
#   s'arrête là, les sondages de l'entre-deux-tours sont écartés ;
# - `candidate` : candidate_id du registre ; `bloc` : bloc du candidat à cette élection
#   (vérifié contre `Registry.bloc_of`) ;
# - `sign` (chocs seulement) : effet attendu sur le candidat, +1 ou −1 ;
# - `beneficiaries` (retraits, ralliements) : candidats qui récupèrent l'électorat ;
# - `new_entrant` : première candidature présidentielle sous une étiquette ou un parti
#   nouveau (Montalvo et al. 2019) ;
# - `sources` : pages consultées le 2026-10-20 (les dates 2026 viennent aussi de
#   docs/notes/veille-2026-10-20.md) ; `note` : réserves.
#
# Dates vérifiées le 2026-10-20 sur les pages citées. Les sondages sont rares avant les six
# derniers mois de chaque campagne : plusieurs événements anciens n'ont qu'un ou deux
# sondages dans la fenêtre de l'étude (signalé par l'étude, pas ici).

events:
  # --- 2007
  - id: ps_primary_2006
    election: 2007
    type: primary
    date: 2006-11-16
    candidate: royal_segolene
    bloc: left
    note: Vote des militants PS, 60,60 % ; investiture à la Mutualité le 26 novembre.
    sources: [https://fr.wikipedia.org/wiki/%C3%89lection_pr%C3%A9sidentielle_fran%C3%A7aise_de_2007]
  - id: sarkozy_declaration_2006
    election: 2007
    type: declaration
    date: 2006-11-29
    candidate: sarkozy_nicolas
    bloc: right
    sources: [https://fr.wikipedia.org/wiki/%C3%89lection_pr%C3%A9sidentielle_fran%C3%A7aise_de_2007]
  - id: bayrou_declaration_2006
    election: 2007
    type: declaration
    date: 2006-12-02
    candidate: bayrou_francois
    bloc: centre
    new_entrant: true
    note: >-
      Troisième candidature de Bayrou, mais la première en centre autonome (UDF hors de la
      droite) ; traité comme nouvel entrant pour l'étude Montalvo, avec cette réserve.
    sources: [https://fr.wikipedia.org/wiki/%C3%89lection_pr%C3%A9sidentielle_fran%C3%A7aise_de_2007]
  - id: ump_designation_2007
    election: 2007
    type: primary
    date: 2007-01-14
    candidate: sarkozy_nicolas
    bloc: right
    note: Désignation sans concurrent par les adhérents UMP (98,1 %).
    sources: [https://fr.wikipedia.org/wiki/%C3%89lection_pr%C3%A9sidentielle_fran%C3%A7aise_de_2007]
  - id: hulot_withdrawal_2007
    election: 2007
    type: withdrawal
    date: 2007-01-22
    candidate: hulot_nicolas
    bloc: left
    sources: [https://fr.wikipedia.org/wiki/%C3%89lection_pr%C3%A9sidentielle_fran%C3%A7aise_de_2007]

