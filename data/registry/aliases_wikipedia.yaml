# Alias des libellés rencontrés dans les listes de sondages Wikipédia FR -> ids du registre.
#
# Lu par vvs.ingest.wikipedia.common.load_aliases. Les clés sont comparées après
# normalisation (ASCII minuscule, parenthèses de parti retirées, tirets et apostrophes en
# espaces) : « Jean-Luc Mélenchon ( LFI ) » et « jean luc melenchon » sont la même clé.
# Un libellé absent fait échouer le parsing : on complète ce fichier, on ne devine pas.
#
# candidates.common : libellés valables pour toutes les élections.
# candidates.elections.<AAAA> : libellés propres à une élection, prioritaires sur common.
#   Les noms seuls qui désignent des personnes différentes selon l'époque (« Le Pen »
#   père ou fille) ne vont JAMAIS dans common.
# Convention d'id (data/registry/README.md) : nom_prenom ASCII ; la particule « de » fait
# partie du nom, comme dans candidates.yaml (de_villepin_dominique, de_villiers_philippe).
#
# candidates.ambiguous : libellés reconnus qui ne désignent pas une personne unique
#   (« 34 Bardella / Le Pen » : candidat RN non tranché) ; l'hypothèse est écartée et
#   journalisée, sans erreur.
#
# pollsters : libellé d'institut -> id court, ou {pollster, sponsor} quand le libellé
# accole un commanditaire ou partenaire (« Ifop-Fiducial »). « (rolling) » désigne les
# enquêtes quotidiennes glissantes : même institut, même id.

