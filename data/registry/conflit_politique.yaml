# Indicateurs socio-économiques par commune de Cagé et Piketty (2023), « Une histoire du
# conflit politique » : données ouvertes du site du livre.
#
# Lu par vvs.ingest.conflit_politique : `vvs ingest conflit-politique` télécharge chaque archive
# dans data/raw/conflit_politique/<name> avec <name>.meta.json (URL, heure, taille, sha256,
# licence) ; un fichier présent n'est jamais réécrit, son empreinte est vérifiée.
# `vvs parse conflit-politique` lit les membres listés et écrit
# data/curated/communes_socio.parquet (une ligne par commune et par année de `years`).
#
# Seules les archives socio-économiques utiles sont téléchargées : pas les résultats
# électoraux du site (on a les nôtres, ministère de l'Intérieur), ni le capital immobilier,
# la nationalité, l'alphabétisation, l'enseignement privé (non retenus pour l'étude des
# reports), ni les « nuances politiques (sources) » (15,9 Go).
#
# Relevé le 2026-10-22 sur la page « Télécharger » (Next.js, URL des archives dans
# __NEXT_DATA__ : pageProps.socioDownloadUrls ; tailles annoncées en Mo dans
# socioDownloadSizes ; archives déposées les 27 août et 11 septembre 2023, version 1.1.5 du
# site du 2/9/2025).
#
# Format des fichiers communaux : CSV larges, séparateur virgule, UTF-8, une ligne par
# commune, une colonne par variable et par année (suffixe AAAA : `revratio2017`), séries
# annuelles interpolées par les auteurs entre recensements. Clé `codecommune` (code INSEE sur
# 5 caractères) avec `dep`, `nomcommune`.

source:
  title: "Julia Cagé et Thomas Piketty, Une histoire du conflit politique. Élections et inégalités sociales en France, 1789-2022, données communales"
  url: https://www.unehistoireduconflitpolitique.fr/telecharger.html
  retrieved: 2026-10-22
  licence: >-
    Pas de licence nommée (ni Etalab, ni Creative Commons) sur le site ; la page de
    téléchargement indique : « Vous pouvez télécharger librement l'ensemble de ces données qui
    sont entièrement à votre disposition, mais n'oubliez pas de citer la source ». Usage
    libre avec obligation de citation ; les bruts ne sont pas redistribués (data/raw/ hors
    git).
  citation: >-
    Julia Cagé et Thomas Piketty (2023), Une histoire du conflit politique. Élections et
    inégalités sociales en France, 1789-2022, Paris, Le Seuil ; données :
    https://www.unehistoireduconflitpolitique.fr

# Années extraites dans communes_socio.parquet : premiers tours des présidentielles étudiées
years: [2002, 2007, 2012, 2017, 2022]

