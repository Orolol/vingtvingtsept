      left_excl_royal est le « Sous-total Gauche (Hors S. Royal) » de la source ; sa composition
      exacte n'est pas détaillée (seul Besancenot est donné en « dont »). Dans d'autres tableaux
      de la même page, le regroupement « ExG + M-G. Buffet + D. Voynet » apparaît, ce qui suggère
      (inférence, non confirmée par la source) que le sous-total regroupe Laguiller, Besancenot,
