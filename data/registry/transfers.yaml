# Reports de voix historiques entre les deux tours (prior des reports `T`, docs/04-modele.md § 4).
#
# Une entrée par source et par second tour, relevée le 2026-10-20 sur le document cité (`url`,
# `pages`). Les chiffres sont recopiés tels quels, en % ; AUCUNE cellule n'est complétée de
# mémoire ni déduite par différence à 100 : une cellule absente du document est absente ici.
# Validé par `vvs.registry.transfers` (`load_transfers()`, `transfer_prior()`).
#
# - `rows[].from` : candidate_id du premier tour (elections.yaml), électorat spécial
#   (`abstain`, `blank_null`, `abstain_or_blank_null`), ou groupe avec `members`.
# - `rows[].to` : les deux finalistes, puis selon `columns` :
#   - `split` : `blank_null` et `abstain` (base : électorat de premier tour) ;
#   - `combined` : `blank_or_abstain`, la source ne distinguant pas blancs-nuls et abstention ;
#   - `voters` : `blank_null` seulement (base : votants du second tour) ;
#   - `expressed` : finalistes seuls (base : exprimés du second tour).
# - `base` / `base_note` : population sur laquelle les pourcentages sont calculés.
# - Une ligne complète somme à 100 à 2 points près ; une ligne incomplète ne dépasse pas 100.
#
# Microdonnées Cevipof (PEF 2002 et 2007, FES 2012, ENEF 2017 et 2022) : en accès restreint sur
# data.sciencespo.fr, non utilisées (voir docs/notes/veille-2026-10-20.md § 4.1).

