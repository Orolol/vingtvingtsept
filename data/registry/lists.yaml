# Listes (européennes) et nuances ou coalitions (législatives), par scrutin.
#
# Sert à rattacher les sondages Wikipédia (`vvs.ingest.wikipedia.scrutins`) et les résultats
# nationaux du ministère (`results_lists_<scrutin>.parquet`) à un identifiant stable
# `list_id`, puis à un bloc (`vvs.curate.lists`). Validé par `vvs.curate.lists.load_lists` :
#
# - `label` : libellé officiel de la liste (européennes) ou de la coalition (législatives) ;
#   `head` : tête de liste nationale quand il y en a une (null aux législatives et en 2014,
#   où les listes sont régionales) ;
# - `parties` : ids de parties.yaml (partis ou nuances) ;
# - `bloc` : déduit des partis quand ils sont tous du même bloc ; sinon (alliances) un bloc
#   dominant, obligatoirement accompagné d'une `note` qui le justifie ; un bloc donné qui
#   diffère du bloc des partis exige aussi une note ;
# - `aliases.results` : libellés du ministère (colonne `label`) agrégés dans cette unité. Une
#   entrée qui en a est une « unité de résultat » : l'erreur des sondages se mesure sur ces
#   unités, qui forment une partition des suffrages exprimés. Un libellé du ministère absent
#   d'ici fait échouer la curation ;
# - `aliases.wikipedia` : en-têtes de colonnes et noms en cellule des pages de sondages
#   (comparés après `normalize_label` et retrait des parenthèses : « UDC ( LR - UDI ) » se
#   lit « udc ») ;
# - `group` : composante sondée à part d'une unité de résultat (Ciotti dans « RN et alliés »,
#   Agir dans Renaissance) : ses parts s'ajoutent à l'unité pour le calcul des erreurs, et une
#   cellule de sondage fusionnée sur plusieurs composantes d'un même groupe vaut pour le
#   groupe ;
# - ni `results` ni `group` : liste ou parti testé dans des hypothèses qui n'ont pas eu lieu
#   (liste Lassalle 2019, partis de gauche séparés en 2024) : gardé dans les sondages, compté
#   comme candidat en trop dans les erreurs (`config_distance`), comme pour les présidentielles ;
# - `residual: true` : unité « divers » de l'élection ; elle reçoit les petites listes sans
#   colonne dans les sondages et, côté sondages, la colonne « Autres » (id réservé `other`).
#
# Sources des rattachements : résultats du ministère (results_lists_*.parquet) et lignes
# « Résultats » des pages Wikipédia, qui donnent la correspondance colonne -> score.

