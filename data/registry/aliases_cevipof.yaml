  En Marche: centre
  Les Républicains: right
  Front National: far_right

special:
  # abstention
  Je n'irais pas voter: abstention
  N'ira pas voter: abstention
  Abstention: abstention
  Vous vous êtes abstenu(e): abstention
  Vous vous êtes abstenu: abstention
  Vous vous abstiendrez: abstention
  S'abstiendrait: abstention
  Vous n'iriez pas voter: abstention
  Vous n'êtes pas allé voter: abstention
  (N'est pas allé voter): abstention
  # blancs et nuls
  Je voterais blanc ou nul: blank
  Je voterias blanc ou nul: blank  # coquille du codebook ENEF 2017 V11 bis
  Vote blanc ou nul: blank
  Votera blanc ou nul: blank
  Blank or spoiled: blank
  J'ai voté blanc (bulletin blanc ou enveloppe vide): blank
  J'ai voté nul (deux bulletins, bulletin raturé…): blank
  Vous avez voté blanc: blank
  Vous avez voté nul: blank
  Vous voterez blanc ou nul: blank
  Vous voteriez blanc ou nul: blank
  (A voté blanc ou nul): blank
  (Vous avez voté blanc ou nul): blank
  Vote blanc: blank
  Vote nul: blank
  # ne sait pas, refus, non posé
  DK: undecided
  Ne sait pas: undecided
  Refusal: refused
  Refus: refused
  N'a pas répondu: refused
  Sans réponse: refused
  Non réponse: refused
  # PEF 2007 vague 1 : l'intention est recueillie par vote simulé dans une urne ; refuser
  # l'urne est un refus de répondre, pas un vote blanc
  Refuse de voter dans l'urne: refused
  Not concerned: null
  Non concerné: null
  Non concerné(e): null
  Non enquêté(e): null

turnout:
  # FES 2017 (V1, V3)
  Voted: voted
  Did not vote: abstention
  Wanted to vote, but didn't: abstention
  Generally vote, but didn't: abstention
  Refusal: refused

certainty:
  Définitif: certain
  Peut encore changer: may_change
  Non enquêté(e): null
  Non concerné(e): null
  N'a pas répondu: null

datasets:
  fes2017:
    # French Electoral Study 2017, post-électorale en face à face (9-23 mai 2017),
    # 1 830 répondants ; seul fichier de microdonnées public (CSV « avant import »).
    reader: csv_zip
    member: FES2017_avant_import.csv
    sep: ";"
    respondent_id: A1
    weight: w5  # sociodémographie + diplôme + votes des deux tours de 2017
    cluster: A3  # unité primaire de sondage (tirage aréolaire) : bootstrap par grappes
    vote_round1: {var: V2, kind: recall, turnout: V1}
    vote_round2: {var: V4, kind: recall, turnout: V3}
    socio: {sex: S2, age: S3}

  enef2017_v13:
    # ENEF 2017 vague 13 (16-17 avril 2017, veille du premier tour)
    respondent_id: ID12
    weight: MPSDP  # sociodémographie + vote au premier tour 2012
    vote_round1: {var: MQ1O, kind: intention}
    certainty_round1: MQ1OBIS
    turnout_intent: MQ0BIS
    duels:
      - {var: MIVPRE2A, options: [macron_emmanuel, fillon_francois]}
      - {var: MIVPRE2B, options: [macron_emmanuel, le_pen_marine]}
      - {var: MIVPRE2C, options: [fillon_francois, le_pen_marine]}
      - {var: MIVPRE2D, options: [melenchon_jean_luc, macron_emmanuel]}
      - {var: MIVPRE2E, options: [melenchon_jean_luc, le_pen_marine]}
      - {var: MIVPRE2F, options: [melenchon_jean_luc, fillon_francois]}
    expectations:
      - {var: MVS4, question: win_duel, target: le_pen_marine, opponent: macron_emmanuel}
      - {var: MVS5, question: win_duel, target: fillon_francois, opponent: le_pen_marine}
      - {var: MVS6, question: win_duel, target: macron_emmanuel, opponent: fillon_francois}
      - {var: MVS7, question: win_duel, target: fillon_francois, opponent: melenchon_jean_luc}
      - {var: MVS8, question: win_duel, target: macron_emmanuel, opponent: melenchon_jean_luc}
      - {var: MVS9, question: win_duel, target: le_pen_marine, opponent: melenchon_jean_luc}
      - {var: MVS2_2, question: qualify, target: melenchon_jean_luc}
      - {var: MVS2_3, question: qualify, target: hamon_benoit}
      - {var: MVS2_4, question: qualify, target: macron_emmanuel}
      - {var: MVS2_6, question: qualify, target: fillon_francois}
      - {var: MVS2_8, question: qualify, target: le_pen_marine}
    socio: {sex: SEXE, age_group: AGE_r1}

  enef2017_v14:
    # ENEF 2017 vague 14 (30 avril - 3 mai 2017, entre les deux tours)
    respondent_id: ID12
    weight: NPSDP  # sociodémographie + vote déclaré au premier tour 2017
    vote_round1: {var: NPRES17A, kind: recall}
    vote_round2: {var: NIVPRE2B, kind: intention}
    turnout_intent: NQ0BIST2
