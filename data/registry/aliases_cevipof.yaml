# Recodage des enquêtes du Cevipof vers nos codes (lu par vvs.ingest.cevipof.parse).
#
# Les clés de libellés sont comparées après normalisation (ASCII minuscule, ponctuation et
# parenthèses en espaces) : « (A voté blanc) » et « a vote blanc » sont la même clé. Une
# modalité absente fait échouer le parsing (`vvs parse cevipof`, code de sortie 1) : on
# complète ce fichier, on ne devine pas.
#
# Codes produits : candidate_id de elections.yaml ; bloc de blocs.yaml pour les duels de
# législatives (les options y sont des partis) ; codes réservés `abstention`, `blank` (blanc
# ou nul), `undecided` (ne sait pas, ne se souvient pas), `refused` (refus, non-réponse) ;
# `null` = question non posée au répondant ou non concerné (filtre du questionnaire).
#
# Libellés de candidats : nom complet de préférence. Un nom seul (« Le Pen ») vaut pour le
# candidat de la décennie 2010-2020 ; les jeux de 2002 et 2007 donnent le nom complet.
#
# `datasets.<key>` (clé de cevipof_datasets.yaml) : variables relevées dans le codebook DDI
# public du jeu ; tant que les microdonnées ne sont pas accessibles, `vvs parse cevipof`
# rapporte le jeu comme `absent`, et `codebook_coverage()` vérifie déjà que toutes les
# modalités du codebook sont couvertes (étude back/studies/cevipof_transfers.py).
# - `reader` : stata (défaut, libellés du fichier), spss (pyreadstat, groupe `cevipof`),
#   csv_zip / sas_zip (codes, libellés pris dans le codebook DDI) ;
# - `weight` : poids retenu ; pour une matrice de reports, un poids calé sur les votes
#   déclarés des deux tours quand il existe ;
# - `vote_round1` / `vote_round2` : `var` (choix), `kind` (intention ou recall), `turnout`
#   (variable de participation séparée, recodée par la table `turnout`) ;
# - `duels` : intentions de second tour par hypothèse ; `options` = codes des options dans
#   l'ordre du questionnaire ; `office` = president ou legislative ;
# - `expectations` : anticipations sur échelle 0-10 (`question` = win_duel, qualify) ;
# - `cluster` : unité primaire de sondage des enquêtes en face à face (bootstrap par grappes).

