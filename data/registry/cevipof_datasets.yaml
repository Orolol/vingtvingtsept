# Enquêtes électorales du Cevipof sur data.sciencespo.fr (Dataverse du CDSP, version 5.14).
#
# Une entrée par jeu Dataverse (une vague de panel = un jeu). Relevé le 2026-10-22 par l'API
# native (/api/search, /api/dataverses/{alias}/contents, /api/datasets/:persistentId) avec le
# compte de Gaétan ; validé par vvs.ingest.cevipof.registry. `vvs ingest cevipof --check`
# compare ce fichier à l'API.
#
# - `pid` / `url` : DOI du jeu. `version` : version publiée relevée.
# - `files` : `id` Dataverse (pour /api/access/datafile/{id}), nom, `format` = type MIME du
#   fichier déposé (`originalFileFormat`, Stata ou SPSS pour les fichiers tabulés), `size` en
#   octets du fichier déposé, `restricted`. `role: data` = fichier de microdonnées retenu
#   (Stata d'origine de préférence, lu par pandas). `fetch` = téléchargé par
#   `vvs ingest cevipof` dans data/raw/cevipof/<key>/ ; `sha256` ajouté au premier
#   téléchargement.
# - `access` : `restricted_request` = microdonnées en accès restreint, sur demande via
#   l'entrepôt (`fileAccessRequest: true`) ; la documentation (questionnaire, codebook DDI,
#   rapport technique) est publique sauf mention `restricted: true`.
# - `request` : demande d'accès lancée pour le fichier `data` (`vvs ingest cevipof
#   --request-access`) ; `priority` : core (reports, duels, anticipations), useful, listed.
# - `stage` : moment de la vague par rapport à la présidentielle `election` (dates des tours
#   de elections.yaml) ; `fieldwork_*` : dates de collecte des métadonnées Dataverse.
# - `questions` : variables utiles repérées dans le codebook DDI public (nom, libellé), par
#   rôle : vote_round1, vote_round2 (intention ou vote déclaré selon la vague), turnout
#   (participation déclarée), turnout_intent, certainty, duel_intention (second tour par
#   hypothèse), expected_winner (anticipations : chances de gagner ou de se qualifier),
#   preferred (candidat souhaité), second_choice, potential (probabilité de voter pour),
#   weight, other. ENEF 2022 : codebooks restreints, variables lues dans les questionnaires
#   PDF publics (`note`). Absent quand rien n'a été relevé.
# - `stage` de l'ENEF 2022 et dates des vagues 7 à 12 : en-têtes des questionnaires.
#
# Ce qui n'existe pas sur l'entrepôt au 2026-10-22 : Présidoscopie et TriÉlec 2012 (aucun
# résultat de recherche), aucune vague ENEF 2027 (pas de collection ENEF2026 ni ENEF2027 ;
# l'ENEF 2022 compte 12 vagues plus une 6 bis, pas de vague 13). Toutes les microdonnées
# sont en accès restreint, sauf deux fichiers signalés (fes2017, fes2022_elipss_v3).

