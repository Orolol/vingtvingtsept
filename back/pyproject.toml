[project]
name = "vvs"
version = "0.0.1"
description = "vingtvingtsept — prévision de la présidentielle 2027"
requires-python = ">=3.12,<3.13"
dependencies = [
    "polars>=1.0",
    "pyarrow>=17",
    "duckdb>=1.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5",
    "pandas>=2.2",
    "pydantic>=2.7",
    "pyyaml>=6",
    "typer>=0.12",
    "numpy>=1.26",
    "pdfplumber>=0.11",
    "python-dateutil>=2.9",
    "unidecode>=1.3",
]

[project.scripts]
vvs = "vvs.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-xdist>=3.5",
    "ruff>=0.5",
]
model = [
    "jax>=0.4.30",
    "numpyro>=0.15",
    "matplotlib>=3.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vvs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests lents (réseau, gros fichiers) — exclus par défaut avec -m 'not slow'",
]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 100
target-version = "py312"
